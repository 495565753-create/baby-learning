<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7e8">
  <meta name="description" content="25款有闯关目标的原创网页小游戏，含5款各50关的进阶游戏，适合亲子一起挑战。">
  <title>果粒橙 · 25款闯关小游戏</title>
  <link rel="stylesheet" href="kids.css?v=7">
  <link rel="stylesheet" href="nav.css?v=1">
</head>
<body class="kids-arcade-page">
  <header class="topbar">
    <a id="back-link" class="arcade-home-link" href="../index.html?section=games" aria-label="返回游戏乐园"><span class="arcade-home-link__icon" aria-hidden="true">🏠</span><span>游戏乐园</span></a>
    <strong class="brand"><img src="assets/fluent/star.svg" alt=""><span class="sr-only">小小闯关乐园</span></strong>
    <button id="music-button" class="icon-tool music-button" type="button" aria-label="关闭音乐" aria-pressed="true"><img src="assets/fluent/music.svg" alt=""></button>
  </header>
  <main>
    <section class="hero" aria-label="25 款闯关游戏"><img src="assets/fluent/rocket.svg" alt=""><span class="hero-count">25</span><img src="assets/fluent/star.svg" alt=""></section>
    <section class="catalog" aria-label="50关进阶游戏">
      <div class="section-heading"><h2 class="sr-only">50关进阶游戏</h2><span aria-hidden="true">★ ★ ★</span></div>
      <div class="game-list level-link-list">
        <a class="game-card" href="levels.html#traffic" aria-label="车车出逃，50关"><img class="card-art" src="assets/fluent/car.svg" alt=""><span class="level-link-count">50</span></a>
        <a class="game-card" href="levels.html#boxes" aria-label="星星搬运队，50关"><img class="card-art" src="assets/fluent/box.svg" alt=""><span class="level-link-count">50</span></a>
        <a class="game-card" href="levels.html#maze" aria-label="迷宫寻宝，50关"><img class="card-art" src="assets/fluent/maze.svg" alt=""><span class="level-link-count">50</span></a>
        <a class="game-card" href="levels.html#pipes" aria-label="水管小工程师，50关"><img class="card-art" src="assets/fluent/pipes.svg" alt=""><span class="level-link-count">50</span></a>
        <a class="game-card" href="levels.html#slide" aria-label="图片拼拼乐，50关"><img class="card-art" src="assets/fluent/slider.svg" alt=""><span class="level-link-count">50</span></a>
      </div>
    </section>
    <section class="catalog" aria-label="选择游戏">
      <div class="section-heading"><h2 class="sr-only">选一款开始挑战</h2><span aria-hidden="true">● ● ●</span></div>
      <div id="game-list" class="game-list"></div>
    </section>
    <section id="play" class="play-section" aria-label="游戏区">
      <div class="play-heading"><div class="play-identity"><img id="play-icon" src="assets/fluent/dino.svg" alt=""><span id="play-category" class="sr-only">动作闯关</span><h2 id="play-title" class="sr-only">恐龙跳跳</h2><p id="play-description" class="sr-only">看准时机跳过障碍</p></div><div class="play-tools"><button id="speak-button" class="icon-tool" type="button" aria-label="听游戏玩法"><img src="assets/fluent/sound.svg" alt=""></button><button id="restart-game-button" class="icon-tool arcade-restart" type="button" aria-label="重新玩当前游戏"><img src="assets/fluent/repeat.svg" alt=""></button><a href="#game-list" class="icon-tool" aria-label="换游戏"><img src="assets/fluent/home.svg" alt=""></a></div></div>
      <div class="game-shell">
        <div class="game-info"><span id="game-metric" aria-label="准备开始"></span><span id="game-status" role="status" class="sr-only">点开始后，会听到语音提示</span></div>
        <div id="game-board" class="game-board"></div>
        <div id="game-controls" class="game-controls"></div>
      </div>
    </section>
    <details class="parent-guide"><summary aria-label="查看家长说明">ⓘ</summary><div id="parent-game-info"></div><button id="reset-progress" type="button">清除星星记录</button><p>点三角形开始；点喇叭重听玩法。首次触碰后会播放音乐和语音。</p></details>
    <footer>游戏图标来自 Microsoft Fluent Emoji，语音使用 Kokoro 开源中文模型。</footer>
  </main>
  <script src="kids-grid.js?v=5" defer></script>
  <script src="kids-puzzle.js?v=3" defer></script>
  <script src="kids-arcade.js?v=3" defer></script>
  <script src="kids-mind.js?v=2" defer></script>
  <script src="kids.js?v=10" defer></script>
</body>
</html>
