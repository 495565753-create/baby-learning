    if (stories.length === 0) {
      // Fallback to embedded stories
      stories = [{"title": "汪汪队大火救援", "pages": [{"text": "汪汪队总部响起警报！莱德说：“城市里发生了大火，我们需要马上出发！”", "kw": "汪汪队 警报 大火"}, {"text": "勇敢的毛毛开着消防车，第一个冲向火场。他大声喊：“我来了，不要怕！”", "kw": "毛毛 消防车 火场"}, {"text": "阿奇用扩音器让大家保持安全距离。他说：“请退后，这里很危险！”", "kw": "阿奇 安全 危险"}, {"text": "毛毛举起巨大的消防水管，对着火焰喷出高高的水柱。火焰慢慢变小了。", "kw": "水管 喷水 火焰"}, {"text": "莱德在空中驾驶直升机观察，指挥伙伴们：“干得好，左边还有一点火苗！”", "kw": "莱德 直升机 指挥"}, {"text": "大火终于被扑灭，大家都安全了。市民们欢呼：“谢谢汪汪队，你们是最棒的！”", "kw": "扑灭 安全 欢呼"}], "id": "paw_01", "icon": "🐶", "img_prefix": "img/paw/paw_01", "audio_prefix": "audio/paw/paw_01"}, {"title": "小猫卡在树上啦！", "pages": [{"text": "冒险湾阳光明媚。一只小猫咪爬上了高高的大树。它下不来了，喵喵叫。", "kw": "阳光下的冒险湾，一棵高高的大树，小猫在树枝上喵喵叫。"}, {"text": "莱德接到求救电话。他立刻召集汪汪队。狗狗们跑到总部集合。", "kw": "莱德在总部接电话，狗狗们跑向总部，汪汪队集结。"}, {"text": "毛毛开车第一个到达。他架起云梯消防车，梯子伸向小猫。", "kw": "毛毛驾驶消防车赶到，云梯升向树上的小猫。"}, {"text": "小猫害怕得发抖，不敢往下跳。毛毛爬上梯子，轻声安慰它。", "kw": "毛毛爬上云梯，伸手安慰发抖的小猫。"}, {"text": "毛毛轻轻抱起小猫，慢慢爬下梯子。小猫安全地回到地面。", "kw": "毛毛抱着小猫从梯子下来，树下的大家开心鼓掌。"}, {"text": "莱德奖励汪汪队小狗饼干。小猫开心地蹭着毛毛的腿。汪汪队又成功了！", "kw": "莱德给汪汪队发饼干，小猫蹭毛毛的腿，大家快乐合影。"}], "id": "paw_02", "icon": "🐶", "img_prefix": "img/paw/paw_02", "audio_prefix": "audio/paw/paw_02"}, {"title": "汪汪队：洪水救援", "pages": [{"text": "冒险湾下起了大雨，河水涨得好高。汪汪队，我们要出发了！", "kw": "大雨"}, {"text": "莱德说：“小砾，用你的挖土机挡住水流！”小砾马上行动起来。", "kw": "小砾"}, {"text": "阿奇发现一只小猫咪被困在树上。他用云梯把小猫安全救下来。", "kw": "阿奇"}, {"text": "毛毛用水上摩托艇靠近一座被水围住的小房子。里面有个小宝宝在哭。", "kw": "毛毛"}, {"text": "天天驾驶直升机，找到一条安全的路线，引导大家往高处走。", "kw": "天天"}, {"text": "洪水退去，大家都安全了！冒险湾的居民们感谢汪汪队。汪汪队真棒！", "kw": "救援成功"}], "id": "paw_03", "icon": "🐶", "img_prefix": "img/paw/paw_03", "audio_prefix": "audio/paw/paw_03"}, {"title": "汪汪队立大功：雪崩大救援", "pages": [{"text": "冬天到了，冒险湾的山上盖满了厚厚的白雪。莱德和汪汪队正在雪地里开心地玩耍。", "kw": "雪山玩耍"}, {"text": "突然，山上传来轰隆隆的声音，雪崩来了！一只小兔子被困在了雪堆里，害怕得直发抖。", "kw": "雪崩发生"}, {"text": "莱德立刻召集汪汪队，说：“绿色代表出发！阿奇驾驶警车，毛毛开灭火器，我们要去救小兔子！”", "kw": "紧急集合"}, {"text": "汪汪队飞快赶到雪山。阿奇用铲子小心地挖雪，毛毛用温暖的毛毯包住小兔子，小兔子不再发抖了。", "kw": "挖雪救援"}, {"text": "雪崩堵住了山路，大家回不去了。小砾开着推土机，把雪堆推到一边，清理出一条安全的小路。", "kw": "清理道路"}, {"text": "小兔子终于回到了妈妈身边，开心地跳来跳去。莱德说：“没有困难的工作，只有勇敢的狗狗！”", "kw": "成功救援"}], "id": "paw_04", "icon": "🐶", "img_prefix": "img/paw/paw_04", "audio_prefix": "audio/paw/paw_04"}, {"title": "汪汪队立大功：火车脱轨大救援", "pages": [{"text": "小火车咔嚓咔嚓开过来，车上装着好多生日气球。突然，铁轨旁的山石轰隆隆滚下来！", "kw": "火车运气球"}, {"text": "石头挡住铁轨，火车头一歪，“哐当”一声脱轨了。司机叔叔急得直冒汗，大声呼叫：“汪汪队，我们需要帮助！”", "kw": "火车脱轨"}, {"text": "莱德收到信号，立刻吹响汪汪哨。阿奇、毛毛、天天和小砾飞快跑到总部集合。", "kw": "汪汪队集合"}, {"text": "莱德说：“阿奇，你用绞盘拉开石头。毛毛，你喷水冷却火车头。天天，你从空中查看情况。”", "kw": "分配任务"}, {"text": "阿奇拉动绞盘，大石头滚开啦。毛毛用水枪喷水，火车头不再冒烟。天天在空中指挥方向。", "kw": "齐心救援"}, {"text": "大家合力把火车推回铁轨上，司机叔叔开心地笑了：“谢谢汪汪队！”气球又飘起来，火车继续欢快地跑起来。", "kw": "任务完成"}], "id": "paw_05", "icon": "🐶", "img_prefix": "img/paw/paw_05", "audio_prefix": "audio/paw/paw_05"}, {"title": "游轮漏水大救援", "pages": [{"text": "冒险湾的游轮上，突然破了一个洞，海水涌进来。船长急忙呼叫汪汪队，莱德马上集合狗狗们。", "kw": "游轮甲板破洞，海水流入，船长挥手求救"}, {"text": "莱德说：“别担心，汪汪队要出动了！”阿奇开着警车，毛毛开着消防车，天天驾驶直升机，飞速赶往码头。", "kw": "莱德指挥，阿奇、毛毛、天天分别驾驶车辆出发"}, {"text": "天天在空中发现游轮的位置，用对讲机告诉伙伴们。毛毛跳上船，用他的水炮管堵住小洞，但水还在漏。", "kw": "天天在直升机上指点，毛毛用水炮管堵洞"}, {"text": "阿奇用绞盘将救生圈抛给受惊的乘客，安抚他们。莱德说：“我们需要更大的塞子！”", "kw": "阿奇用绞盘抛救生圈，乘客穿救生衣"}, {"text": "聪明的莱德想到了办法，他让天天吊来一块大橡胶垫。阿奇和毛毛一起把垫子压在破洞上，水终于止住了！", "kw": "天天吊着橡胶垫，阿奇和毛毛合力压住破洞"}, {"text": "游轮安全了，所有人都欢呼起来。船长感谢汪汪队，狗狗们说：“没有困难的工作，只有勇敢的狗狗！”", "kw": "游轮恢复平静，狗狗们和船长合影，夕阳下庆祝"}], "id": "paw_06", "icon": "🐶", "img_prefix": "img/paw/paw_06", "audio_prefix": "audio/paw/paw_06"}, {"title": "飞机迫降大救援", "pages": [{"text": "一架观光小飞机在冒险湾上空快乐地飞行。突然，引擎发出噗噗的怪声，飞机开始摇晃起来。飞行员着急地呼叫救援。", "kw": "蓝色小飞机, 摇晃的翅膀, 蓝天白云, 飞行员紧张"}, {"text": "天天正在空中巡逻，发现了故障飞机。她立刻飞回总部告诉莱德：“有飞机需要紧急迫降！”", "kw": "天天驾驶直升机, 莱德在总部, 屏幕显示警报"}, {"text": "莱德召集汪汪队：“我们需要清理跑道，准备救援！”小砾开着推土机去清理碎石，阿奇用警车指挥大家远离跑道。", "kw": "小砾推土机, 阿奇警车闪灯, 清理跑道, 狗狗们集合"}, {"text": "飞机开始下降，天天在它旁边勇敢地引导：“别怕，跟着我，慢慢对准跑道！”毛毛也准备好了急救箱在跑道旁等待。", "kw": "天天伴飞, 飞机对准跑道, 毛毛拿着急救箱"}, {"text": "飞机安全着陆，颠簸了几下后稳稳停住。飞行员走下飞机，紧紧拥抱天天：“谢谢汪汪队，你们是最棒的！”", "kw": "飞机着陆摩擦火花, 飞行员拥抱天天, 狗狗们欢呼"}, {"text": "莱德开心地说：“没有困难的工作，只有勇敢的狗狗！”冒险湾恢复了平静，汪汪队又立了一功。", "kw": "莱德抚摸天天, 汪汪队合影, 夕阳下冒险湾平静"}], "id": "paw_07", "icon": "🐶", "img_prefix": "img/paw/paw_07", "audio_prefix": "audio/paw/paw_07"}, {"title": "大桥救援记", "pages": [{"text": "冒险湾的大桥轰隆一声塌了！车辆和行人都过不去。莱德立刻召集汪汪队。", "kw": "大桥坍塌"}, {"text": "阿奇用绞盘拉起落水的木头。毛毛升起云梯，把被困的小猫救下来。", "kw": "紧急救援"}, {"text": "小砾开着挖土机，清理大石块。灰灰用回收工具，把碎木板变成临时桥板。", "kw": "清理重建"}, {"text": "路马启动气垫船，在河面搭建浮桥。大家喊：“加油，汪汪队！”", "kw": "搭建浮桥"}, {"text": "新桥暂时修好啦！人们小心地通过，笑着挥手说谢谢。狗狗们自豪地摇尾巴。", "kw": "临时通行"}, {"text": "莱德说：“没有困难的工作，只有勇敢的狗狗！”冒险湾又恢复了欢笑。", "kw": "勇敢狗狗"}], "id": "paw_08", "icon": "🐶", "img_prefix": "img/paw/paw_08", "audio_prefix": "audio/paw/paw_08"}, {"title": "汪汪队立大功：地震大救援", "pages": [{"text": "冒险湾突然晃动起来，地震了！莱德赶紧召集汪汪队。", "kw": "地震"}, {"text": "毛毛用云梯救出被困高楼的小猫。它说：“别怕，我来啦！”", "kw": "云梯"}, {"text": "小砾的挖掘机移开倒塌的石头，找到被压住的小鸟。", "kw": "挖掘机"}, {"text": "天天开着直升机从空中搜寻，发现山边有受困的兔子。", "kw": "直升机"}, {"text": "阿奇用警车开路，引导大家安全到达空地。", "kw": "空地"}, {"text": "汪汪队又一次救了大家！莱德说：“真是团结的好伙伴！”", "kw": "团结"}], "id": "paw_09", "icon": "🐶", "img_prefix": "img/paw/paw_09", "audio_prefix": "audio/paw/paw_09"}, {"title": "汪汪队立大功：海啸预警", "pages": [{"text": "今天，汪汪队在海滩上开心地玩耍。突然，莱德的平板电脑发出了“滴滴滴”的警报声。", "kw": "警报"}, {"text": "莱德赶紧集合大家，说：“海啸要来了，我们必须立刻行动！”他派汪汪队去帮助所有人安全撤离。", "kw": "撤离"}, {"text": "阿奇用警车拦住了海滩入口，提醒大家别再靠近。毛毛开着消防车，载着游客快快离开。", "kw": "警戒"}, {"text": "小砾用推土机堆起高高的沙墙，想挡住海浪。天天驾驶直升机在空中巡逻，寻找还没走的人。", "kw": "沙墙"}, {"text": "巨大的海浪冲了过来，但海滩上已经没有人了。大家都安全地站在小山上，汪汪队也及时撤到了高处。", "kw": "安全"}, {"text": "海啸过后，大家都很感谢汪汪队。莱德笑着说：“你们做得真棒！记住，听到警报就要立刻往高处跑。”", "kw": "感谢"}], "id": "paw_10", "icon": "🐶", "img_prefix": "img/paw/paw_10", "audio_prefix": "audio/paw/paw_10"}, {"title": "汪汪队立大功：火山爆发", "pages": [{"text": "冒险湾的火山突然轰隆隆响，冒出浓浓的灰烟。莱德接到警报，立刻召唤汪汪队集合。", "kw": "volcano"}, {"text": "“火山要爆发了，我们得赶紧让动物们安全撤离！”莱德说。毛毛驾驶直升机，阿奇用扩音器通知大家。", "kw": "warning"}, {"text": "小砾开着推土机，在火山脚挖出一条安全通道。灰灰用回收爪搬开挡路的石头，帮助小兔子们通过。", "kw": "evacuation"}, {"text": "火山喷出滚烫的岩浆，往森林流去。天天从空中洒水降温，路马驾驶气垫船挡住岩浆流。", "kw": "lava"}, {"text": "汪汪队齐心协力，把岩浆引到了大海边。大家成功保护了冒险湾，动物们都安全了。", "kw": "teamwork"}, {"text": "火山终于安静下来，汪汪队累得坐在地上。莱德夸奖大家：“只要团结合作，再大的困难也不怕！”", "kw": "safe"}], "id": "paw_11", "icon": "🐶", "img_prefix": "img/paw/paw_11", "audio_prefix": "audio/paw/paw_11"}, {"title": "汪汪队立大功：龙卷风来啦", "pages": [{"text": "天空突然变黑了，大风呼呼地吹。树叶和帽子都被吹上了天。", "kw": "乌云，大风，树叶飞"}, {"text": "莱德拿出平板一看，龙卷风马上要来了。他大声喊：“汪汪队，总部集合！”", "kw": "莱德，平板，警报"}, {"text": "狗狗们飞快地滑下滑梯，坐上自己的车。莱德说：“大家要帮助朋友们躲进安全屋。”", "kw": "滑梯，狗狗，等待指令"}, {"text": "毛毛拉响警笛，提醒大家快进屋。路马开着气垫船，把岸边的鸭子带上船。", "kw": "毛毛，消防车，路马，鸭子"}, {"text": "小砾用推土机推开倒下的大树。灰灰修好了被风吹坏的屋顶。", "kw": "小砾，推土机，灰灰，修屋顶"}, {"text": "龙卷风走了，太阳出来了。大家都安全了，笑着说：“谢谢汪汪队！”", "kw": "晴天，安全，大家笑"}], "id": "paw_12", "icon": "🐶", "img_prefix": "img/paw/paw_12", "audio_prefix": "audio/paw/paw_12"}, {"title": "蜜蜂大迁移", "pages": [{"text": "莱德和汪汪队正在瞭望台玩耍。突然，电话铃响了，是农夫由美打来的。她说：“蜜蜂们要搬家，需要帮助！”", "kw": "蜜蜂搬家 求助"}, {"text": "莱德立刻召集汪汪队。他说：“阿奇，我们需要你的梯子；灰灰，带上你的网兜。”大家迅速出发，赶往农场。", "kw": "汪汪队出发 工具"}, {"text": "在农场，蜜蜂们嗡嗡嗡地飞着，找不到新家。阿奇架起梯子，灰灰轻轻用网兜引导蜜蜂飞向新蜂箱。", "kw": "引导蜜蜂 新蜂箱"}, {"text": "突然，一阵大风吹来，把蜂箱盖子吹跑了。小蜜蜂们害怕极了，到处乱飞。毛毛拿出他的水枪，小心地喷水挡风。", "kw": "大风 毛毛帮忙"}, {"text": "天天用她的直升机从空中撒下花瓣，吸引蜜蜂。蜜蜂们闻到花香，慢慢聚拢过来，飞进了新蜂箱。", "kw": "天天撒花瓣 聚拢"}, {"text": "蜜蜂们在新家开心地跳起舞。农夫由美说：“谢谢汪汪队！你们是最棒的。”莱德说：“只要齐心协力，没有办不到的事！”", "kw": "蜜蜂安家 感谢"}], "id": "paw_13", "icon": "🐶", "img_prefix": "img/paw/paw_13", "audio_prefix": "audio/paw/paw_13"}, {"title": "停电大救援", "pages": [{"text": "冒险湾突然停电了，到处黑乎乎的。", "kw": "停电"}, {"text": "莱德接到电话，谷仓里的小动物需要保暖。", "kw": "求助"}, {"text": "阿奇用他的警车灯照亮道路，毛毛开着消防车来帮忙。", "kw": "照明"}, {"text": "小砾挖掘机挖开地面，发现断裂的电线。", "kw": "抢修"}, {"text": "天天空降下新的电缆，路马在水边保证安全。", "kw": "合作"}, {"text": "电修好了，灯光亮起，大家欢呼起来。", "kw": "恢复"}], "id": "paw_14", "icon": "🐶", "img_prefix": "img/paw/paw_14", "audio_prefix": "audio/paw/paw_14"}, {"title": "汪汪队：隧道大救援", "pages": [{"text": "汪汪队正在基地玩耍。突然，电话响了！莱德接到紧急通知：山上的隧道塌方了，小兔子被困在里面。", "kw": "汪汪队 隧道塌方 小兔子"}, {"text": "莱德立刻召集汪汪队：“毛毛，我们需要你的挖掘机挖开落石！小砾，你的推土机来清理碎石！”", "kw": "莱德 毛毛 小砾 挖掘机 推土机"}, {"text": "毛毛开着挖掘机，小心地挖开大石头。小砾用推土机把碎石推到一边。他们一起努力，很快看到了隧道口。", "kw": "挖掘 推土 碎石 隧道口"}, {"text": "天天驾驶直升机在空中观察：“莱德，我看到小兔子了！它躲在角落里，没有受伤，只是有点害怕。”", "kw": "天天 直升机 观察 小兔子"}, {"text": "阿奇钻进隧道，温柔地抱起小兔子：“别怕，小兔子，我们带你出去。”他慢慢爬出隧道，把兔子交给莱德。", "kw": "阿奇 钻进 抱起 带出"}, {"text": "小兔子安全了，开心地跳起来。莱德夸奖汪汪队：“你们又完成了一次完美的救援！没有困难的工作，只有勇敢的狗狗！”", "kw": "安全 夸奖 救援 勇敢狗狗"}], "id": "paw_15", "icon": "🐶", "img_prefix": "img/paw/paw_15", "audio_prefix": "audio/paw/paw_15"}, {"title": "汪汪队破冰救援", "pages": [{"text": "冬天到了，冒险湾的湖面结冰了。小朋友们开心地在冰上滑来滑去。", "kw": "滑冰的孩子"}, {"text": "突然，咔嚓一声，冰面裂开了！小莉掉进了冰冷的湖水里，害怕地哭喊。", "kw": "冰面破裂"}, {"text": "莱德接到求救电话，立刻召唤汪汪队：“阿奇、毛毛，出发救援！”汪汪队跳上车子，火速赶往湖边。", "kw": "莱德召唤"}, {"text": "阿奇用安全绳拉住小莉，毛毛披上保暖毯靠近。大家小心地趴在冰面上，慢慢把小莉拉上来。", "kw": "冰上救援"}, {"text": "小莉被救上岸，浑身发抖。毛毛用热风轻轻吹干她，阿奇递上热巧克力。小莉终于不哭了。", "kw": "温暖照顾"}, {"text": "莱德提醒大家：“春天冰面变薄，千万不能上冰玩哦！”小朋友们点头，和汪汪队一起安全回家。", "kw": "安全回家"}], "id": "paw_16", "icon": "🐶", "img_prefix": "img/paw/paw_16", "audio_prefix": "audio/paw/paw_16"}, {"title": "毒蛇入侵大冒险", "pages": [{"text": "阳光明媚的早晨，冒险湾突然出现了一条小毒蛇。汪汪队接到警报，立刻集合出发！", "kw": "毒蛇出现"}, {"text": "毛毛用热成像扫描，发现小蛇躲在大石头后面。阿奇提醒大家：“小心，不要惊吓它。”", "kw": "发现蛇踪"}, {"text": "小砾用挖掘机铲斗轻轻围住小蛇，防止它乱跑。天天从空中观察，确保大家安全。", "kw": "安全围堵"}, {"text": "灰灰想起蛇怕噪音，拿来一个温柔的小铃铛，轻轻晃动引导小蛇离开。", "kw": "巧妙引导"}, {"text": "小蛇跟着铃铛声慢慢爬进特制的运输箱里。路马把箱子搬上船，准备送回远处的森林。", "kw": "安全转移"}, {"text": "回到森林，小蛇愉快地游走了。莱德夸奖大家：“真棒！我们用智慧保护了大家和小蛇。”", "kw": "快乐结局"}], "id": "paw_17", "icon": "🐶", "img_prefix": "img/paw/paw_17", "audio_prefix": "audio/paw/paw_17"}, {"title": "烟花事故", "pages": [{"text": "冒险湾的夜晚，烟花表演要开始了。大家都仰着头，等着看美丽的光。", "kw": "烟花表演"}, {"text": "突然，一颗烟花弹飞错了方向，点燃了旁边的彩旗。小火苗蹿了起来。", "kw": "起火"}, {"text": "莱德马上按下平板，呼叫汪汪队。毛毛，天天，阿奇，快集合！", "kw": "莱德呼叫"}, {"text": "毛毛开着消防车赶到，喷水灭火。狗狗们保护大家，远远地站好。", "kw": "毛毛灭火"}, {"text": "火很快被扑灭了，没有一个人受伤。大家都松了一口气，拍拍手。", "kw": "扑灭"}, {"text": "莱德拿出安全的小烟花，大家一起玩。今晚的冒险湾，还是那么快乐。", "kw": "安全烟花"}], "id": "paw_18", "icon": "🐶", "img_prefix": "img/paw/paw_18", "audio_prefix": "audio/paw/paw_18"}, {"title": "赛车大救援", "pages": [{"text": "冒险湾正在举行赛车比赛，小砾的赛车突然失控了！", "kw": "赛车比赛"}, {"text": "赛车冲向旋转木马，毛毛用消防车挡住去路。", "kw": "毛毛救援"}, {"text": "赛车又滑向冰淇淋摊，阿奇飞快地拉起了警戒线。", "kw": "阿奇警戒"}, {"text": "天天驾驶直升机放下救生绳，套住了赛车尾部。", "kw": "天天直升机"}, {"text": "莱德指挥大家合力拉紧绳子，赛车终于慢慢减速。", "kw": "团队合作"}, {"text": "赛车安全停下，小砾开心地说：“谢谢汪汪队！”", "kw": "救援成功"}], "id": "paw_19", "icon": "🐶", "img_prefix": "img/paw/paw_19", "audio_prefix": "audio/paw/paw_19"}, {"title": "外星来客", "pages": [{"text": "一天晚上，冒险湾的天空中闪过一道亮光。一架小小的飞碟降落在瞭望塔附近。", "kw": "飞碟降落"}, {"text": "莱德带着汪汪队赶来，发现了一位可爱的外星小朋友。他全身闪闪发光，看起来有点害怕。", "kw": "外星小朋友"}, {"text": "毛毛轻轻走上前，用鼻子碰了碰他。外星小朋友开心地笑了，发出叮咚的声音。", "kw": "毛毛安慰"}, {"text": "外星小朋友指着远处的星星，想要回家。莱德马上呼叫天天，启动直升机帮忙。", "kw": "想要回家"}, {"text": "天天用直升机吊起飞碟，飞向高高的夜空。外星小朋友向汪汪队挥手告别。", "kw": "送别飞碟"}, {"text": "飞碟消失在了星星里，汪汪队仰头望着天空。这真是最奇妙的一次救援！", "kw": "难忘的救援"}], "id": "paw_20", "icon": "🐶", "img_prefix": "img/paw/paw_20", "audio_prefix": "audio/paw/paw_20"}, {"title": "佩奇第一天上幼儿园", "pages": [{"text": "今天是佩奇第一天上幼儿园。她背着小书包，有点紧张。妈妈拉着她的手说：“别担心，会很好玩的。”", "kw": "幼儿园"}, {"text": "教室里，羚羊老师笑眯眯地迎接佩奇。“欢迎你，佩奇！”她带佩奇认识其他小朋友。", "kw": "老师"}, {"text": "小羊苏西跑过来，拉着佩奇的手。“我们一起玩积木吧！”佩奇开心地笑了。", "kw": "朋友"}, {"text": "大家围坐一圈，羚羊老师弹起吉他。佩奇跟着唱起歌，还拍起了小手。", "kw": "唱歌"}, {"text": "午餐时间到了，佩奇和小伙伴们一起吃面包和苹果。她学会了自己收拾餐盘。", "kw": "午餐"}, {"text": "放学时，妈妈来接佩奇。佩奇扑进妈妈怀里：“幼儿园真好玩，明天我还要来！”", "kw": "放学"}], "id": "peppa_01", "icon": "🐷", "img_prefix": "img/peppa/peppa_01", "audio_prefix": "audio/peppa/peppa_01"}, {"title": "佩奇的音乐派对", "pages": [{"text": "佩奇和乔治在客厅里，猪妈妈打开了音乐。大家都开心地拍手。", "kw": "音乐"}, {"text": "佩奇跳起舞来，她转圈圈，像一只小蝴蝶。乔治也跟着跳，跳得高高的。", "kw": "跳舞"}, {"text": "猪爸爸拿起吉他，弹出好听的曲子。佩奇唱起歌来，啦啦啦，真好听。", "kw": "唱歌"}, {"text": "小羊苏西来了，她敲起了小鼓。咚咚咚，大家一起合奏。", "kw": "合奏"}, {"text": "佩奇教乔治跳扭扭舞，扭扭屁股，摇摇手。乔治笑得咯咯咯。", "kw": "扭扭舞"}, {"text": "天黑了，音乐派对结束了。佩奇说：“唱歌跳舞真开心，下次再一起玩！”", "kw": "开心"}], "id": "peppa_03", "icon": "🐷", "img_prefix": "img/peppa/peppa_03", "audio_prefix": "audio/peppa/peppa_03"}, {"title": "画画比赛", "pages": [{"text": "佩奇和朋友们在草地上画画。老师说：“今天我们来比赛，画最喜欢的东西。”", "kw": "比赛"}, {"text": "佩奇画了一朵大大的太阳花。苏西画了一只可爱的蝴蝶。", "kw": "太阳花"}, {"text": "乔治画了一辆小恐龙车。丹尼画了一架飞机。", "kw": "恐龙车"}, {"text": "小兔瑞贝卡画了一篮子胡萝卜。大家都画得很认真。", "kw": "胡萝卜"}, {"text": "老师把画贴在墙上。每一幅画都很好看。", "kw": "画展"}, {"text": "老师笑着说：“每个人都是小画家！”大家开心地拍手。", "kw": "小画家"}], "id": "peppa_04", "icon": "🐷", "img_prefix": "img/peppa/peppa_04", "audio_prefix": "audio/peppa/peppa_04"}, {"title": "佩奇玩传球游戏", "pages": [{"text": "佩奇和乔治在花园里。他们想玩传球游戏。", "kw": "传球游戏"}, {"text": "妈妈猪把球传给佩奇。佩奇跳起来接住球，真开心！", "kw": "接球"}, {"text": "佩奇把球传给乔治。乔治用鼻子顶球，球飞起来了。", "kw": "鼻子顶球"}, {"text": "爸爸猪也来玩。他传给佩奇，佩奇传给妈妈。大家笑哈哈。", "kw": "全家一起玩"}, {"text": "球不小心滚进了泥坑。佩奇说：“没关系，我们一起踩泥坑吧！”", "kw": "泥坑"}, {"text": "大家把球拿出来，洗干净。然后继续传球，直到太阳下山。", "kw": "继续传球"}], "id": "peppa_05", "icon": "🐷", "img_prefix": "img/peppa/peppa_05", "audio_prefix": "audio/peppa/peppa_05"}, {"title": "午餐时间", "pages": [{"text": "叮叮叮！午餐时间到了。佩奇和乔治好饿呀！", "kw": "午餐时间"}, {"text": "猪妈妈端来了美味的意大利面。佩奇开心地拍手。", "kw": "意大利面"}, {"text": "乔治用叉子卷起面条，呼噜呼噜吃得香。", "kw": "叉子"}, {"text": "佩奇说：“乔治，要慢慢吃哦！”乔治点点头。", "kw": "慢慢吃"}, {"text": "吃完午餐，佩奇和乔治吃水果。甜甜的苹果真好吃！", "kw": "水果"}, {"text": "午餐结束了，大家一起收拾桌子。真是快乐的一餐！", "kw": "收拾"}], "id": "peppa_06", "icon": "🐷", "img_prefix": "img/peppa/peppa_06", "audio_prefix": "audio/peppa/peppa_06"}, {"title": "小医生游戏", "pages": [{"text": "佩奇和乔治在玩小医生游戏。佩奇当医生，乔治当病人。", "kw": "医生游戏"}, {"text": "佩奇戴上玩具听诊器，听听乔治的胸口。她说：“你有点咳嗽。”", "kw": "听诊器"}, {"text": "乔治张开嘴巴，佩奇用小电筒照一照。“啊——喉咙有点红。”", "kw": "喉咙"}, {"text": "佩奇拿出玩具体温计，给乔治量一量。“体温正常，不用担心。”", "kw": "体温计"}, {"text": "妈妈猪进来问：“小医生，我能看病吗？”佩奇高兴地说：“当然可以！”", "kw": "妈妈猪"}, {"text": "佩奇给妈妈猪贴上可爱的创可贴。大家一起开心地笑了。", "kw": "创可贴"}], "id": "peppa_07", "icon": "🐷", "img_prefix": "img/peppa/peppa_07", "audio_prefix": "audio/peppa/peppa_07"}, {"title": "佩奇搭积木房子", "pages": [{"text": "佩奇和乔治在玩积木。他们想搭一个高高的房子。", "kw": "积木、房子"}, {"text": "佩奇把积木一块一块叠起来。乔治也来帮忙。", "kw": "叠起来、帮忙"}, {"text": "哎呀，房子倒了！积木撒了一地。", "kw": "倒了、撒了一地"}, {"text": "佩奇说：“没关系，我们再试一次。”他们把积木捡起来。", "kw": "没关系、再试一次"}, {"text": "这次他们搭得稳稳的。房子越搭越高，真漂亮！", "kw": "稳稳的、越搭越高"}, {"text": "房子搭好了！佩奇和乔治开心地拍手。妈妈猪也夸他们真棒。", "kw": "搭好了、拍手、真棒"}], "id": "peppa_08", "icon": "🐷", "img_prefix": "img/peppa/peppa_08", "audio_prefix": "audio/peppa/peppa_08"}, {"title": "户外滑滑梯", "pages": [{"text": "今天阳光真好，佩奇和乔治去公园玩。公园里有一个又高又大的滑滑梯。", "kw": "公园"}, {"text": "佩奇兴奋地爬上楼梯，她说：“我要滑下来啦！”乔治在下面开心地拍手。", "kw": "滑滑梯"}, {"text": "小羊苏西也来了，大家一起排队滑滑梯。一个接一个，真有趣！", "kw": "排队"}, {"text": "佩奇从滑梯上滑下来，风在耳边呼呼响。她笑得合不拢嘴。", "kw": "滑下来"}, {"text": "轮到乔治了，他有点害怕。佩奇张开手臂说：“别怕，乔治，我在下面等你！”", "kw": "勇敢"}, {"text": "乔治鼓起勇气滑下来，大家都为他鼓掌。滑滑梯真好玩，他们玩得满头大汗。", "kw": "好玩"}], "id": "peppa_09", "icon": "🐷", "img_prefix": "img/peppa/peppa_09", "audio_prefix": "audio/peppa/peppa_09"}, {"title": "讲故事时间", "pages": [{"text": "佩奇和乔治坐在地毯上，等着爸爸讲故事。爸爸拿来一本大大的故事书。", "kw": "故事书"}, {"text": "爸爸翻开书，清清嗓子说：“从前，有一只勇敢的小恐龙。”乔治高兴地拍手。", "kw": "小恐龙"}, {"text": "小恐龙走啊走，遇到了会说话的大树。大树说：“你要去哪里呀？”", "kw": "会说话的大树"}, {"text": "爸爸用粗粗的声音模仿大树，佩奇和乔治咯咯笑。猪妈妈也坐过来一起听。", "kw": "模仿声音"}, {"text": "故事里，小恐龙帮助了小鸟，大家都为它鼓掌。佩奇说：“我也要帮助朋友！”", "kw": "帮助朋友"}, {"text": "故事讲完了，爸爸合上书。佩奇和乔治给了爸爸一个大大的拥抱，说：“再讲一个吧！”", "kw": "大大的拥抱"}], "id": "peppa_10", "icon": "🐷", "img_prefix": "img/peppa/peppa_10", "audio_prefix": "audio/peppa/peppa_10"}, {"title": "佩奇做手工", "pages": [{"text": "佩奇和乔治想一起做手工。他们找来了彩纸和胶水。", "kw": "彩纸"}, {"text": "妈妈说：“我们来剪小星星吧。”佩奇小心地拿起剪刀。", "kw": "剪刀"}, {"text": "乔治剪不好，有点着急。佩奇说：“别急，我来帮你。”", "kw": "帮助"}, {"text": "他们把小星星贴在蓝色卡纸上，像夜晚的天空。", "kw": "贴"}, {"text": "爸爸拿来亮片和毛线，说：“还可以再装饰一下。”", "kw": "装饰"}, {"text": "手工完成啦！一幅闪闪发光的星星画，大家都好开心。", "kw": "开心"}], "id": "peppa_11", "icon": "🐷", "img_prefix": "img/peppa/peppa_11", "audio_prefix": "audio/peppa/peppa_11"}, {"title": "佩奇学数数", "pages": [{"text": "佩奇和乔治在花园里玩。他们看到好多花朵。", "kw": "花朵"}, {"text": "妈妈猪问：“这里有几朵花呢？”佩奇开始数：“一、二、三。”", "kw": "数花"}, {"text": "乔治也来数：“一、二、三、四、五！”大家都鼓掌。", "kw": "乔治数数"}, {"text": "爸爸猪拿出水果。“我们来数水果吧！”佩奇数苹果：“一、二、三、四。”", "kw": "数苹果"}, {"text": "乔治数香蕉：“一、二。”佩奇帮他：“三、四、五！”乔治开心地笑。", "kw": "数香蕉"}, {"text": "大家一起数：“一、二、三、四、五！”佩奇学会了数数，真开心。", "kw": "学会数数"}], "id": "peppa_12", "icon": "🐷", "img_prefix": "img/peppa/peppa_12", "audio_prefix": "audio/peppa/peppa_12"}, {"title": "佩奇的角色扮演游戏", "pages": [{"text": "佩奇和乔治在房间里，想玩一个新游戏。佩奇说：“我们来玩角色扮演吧！我可以当医生。”", "kw": "医生"}, {"text": "乔治找来玩具听诊器，佩奇戴上白帽子。她温柔地说：“乔治病人，请张开嘴，让我看看你的喉咙。”", "kw": "听诊器"}, {"text": "这时，妈妈猪走进来，好奇地问：“小医生，我能看病吗？”佩奇高兴地点点头，让妈妈坐在小椅子上。", "kw": "妈妈猪"}, {"text": "妈妈猪假装咳嗽，佩奇认真听她的心跳。然后说：“你需要多喝温水，好好休息，就会好起来。”", "kw": "心跳"}, {"text": "爸爸猪也来了，他假装摔倒了。乔治立刻跑去拿绷带，佩奇哈哈笑：“别担心，乔治护士会帮你包扎！”", "kw": "绷带"}, {"text": "最后，全家一起玩老师游戏。佩奇当老师，教大家唱字母歌，房间里充满了欢笑声。", "kw": "老师"}], "id": "peppa_13", "icon": "🐷", "img_prefix": "img/peppa/peppa_13", "audio_prefix": "audio/peppa/peppa_13"}, {"title": "音乐课", "pages": [{"text": "今天，佩奇和乔治去幼儿园上音乐课。羚羊老师拿出小鼓和摇铃，大家都很开心。", "kw": "音乐课"}, {"text": "羚羊老师教大家拍拍手，跟着节奏走。佩奇拍得很认真，乔治也扭起了小屁股。", "kw": "节奏"}, {"text": "佩奇拿起小鼓咚咚敲，乔治摇着铃铛叮叮响。大家一起合奏，声音真好听。", "kw": "乐器"}, {"text": "羚羊老师弹起吉他，大家跟着唱起歌。佩奇唱得很大声，小羊苏西也唱得笑眯眯。", "kw": "唱歌"}, {"text": "佩奇和朋友们排成一排，一边跳舞一边敲乐器。乔治变成小指挥，小手挥来挥去。", "kw": "跳舞"}, {"text": "音乐课结束了，大家都说真好玩。佩奇和乔治回家，还哼着刚学的歌给妈妈听。", "kw": "回家"}], "id": "peppa_14", "icon": "🐷", "img_prefix": "img/peppa/peppa_14", "audio_prefix": "audio/peppa/peppa_14"}, {"title": "动物模仿游戏", "pages": [{"text": "佩奇和朋友们在花园里玩。佩奇说：“我们来玩动物模仿游戏吧！”", "kw": "模仿游戏"}, {"text": "小羊苏西先来，她学小羊叫：“咩咩咩！”大家都猜对了，是小羊。", "kw": "小羊"}, {"text": "小狗丹尼跳出来，他学小狗叫：“汪汪汪！”还摇摇尾巴，真可爱。", "kw": "小狗"}, {"text": "小猫坎迪轻轻走，她学小猫叫：“喵喵喵！”还伸出爪子洗脸呢。", "kw": "小猫"}, {"text": "小兔瑞贝卡蹦蹦跳，她学小兔跳，还竖起长耳朵，大家都笑了。", "kw": "小兔"}, {"text": "最后佩奇学小猪叫：“哼哼哼！”大家都说佩奇模仿得最像了。", "kw": "小猪"}], "id": "peppa_15", "icon": "🐷", "img_prefix": "img/peppa/peppa_15", "audio_prefix": "audio/peppa/peppa_15"}, {"title": "佩奇分享玩具", "pages": [{"text": "佩奇在玩她的小恐龙。乔治跑过来，也想玩一玩。", "kw": "Peppa playing with dinosaur toy, George coming"}, {"text": "佩奇抱紧恐龙说：“这是我的，不给你。”乔治伤心地哭了。", "kw": "Peppa refusing to share, George crying"}, {"text": "猪妈妈走过来，温柔地说：“你们可以轮流玩呀。”", "kw": "Mummy Pig suggesting taking turns"}, {"text": "佩奇想了想，把恐龙递给乔治。乔治破涕为笑。", "kw": "Peppa handing dinosaur to George, George smiling"}, {"text": "他们一起玩恐龙，你追我赶，笑声不断。", "kw": "Peppa and George playing together happily"}, {"text": "分享真好玩，大家都开心！佩奇和乔治抱在了一起。", "kw": "Peppa and George hugging, sharing is fun"}], "id": "peppa_16", "icon": "🐷", "img_prefix": "img/peppa/peppa_16", "audio_prefix": "audio/peppa/peppa_16"}, {"title": "下雨天室内乐", "pages": [{"text": "下雨了，佩奇和乔治不能出去玩。他们在客厅里觉得有点无聊。", "kw": "rainy day, indoor, bored"}, {"text": "妈妈猪拿来一个大纸箱。她说：“我们来做点好玩的！”", "kw": "cardboard box, Mummy Pig, fun idea"}, {"text": "佩奇画了一个窗户，乔治画了一道门。纸箱变成了小房子！", "kw": "draw, window, door, little house"}, {"text": "他们钻进小房子里喝茶。佩奇假装是妈妈，乔治假装是爸爸。", "kw": "pretend play, tea party, role play"}, {"text": "爸爸猪也想进去，可是房子太小了！他把纸箱举起来，大家笑成一团。", "kw": "Daddy Pig, too small, lift box, laugh"}, {"text": "雨停了，太阳出来了。佩奇说：“雨天在家里也很好玩！”", "kw": "rain stops, sunshine, happy indoor play"}], "id": "peppa_17", "icon": "🐷", "img_prefix": "img/peppa/peppa_17", "audio_prefix": "audio/peppa/peppa_17"}, {"title": "佩奇运动会", "pages": [{"text": "今天天气真好，佩奇和朋友们要开运动会。大家穿上运动服，来到草地上。", "kw": "开幕"}, {"text": "第一个比赛是跑步。佩奇和小羊苏西一起跑，乔治在旁边加油。", "kw": "跑步"}, {"text": "接下来是跳远。小兔瑞贝卡跳得最远，大家都为她鼓掌。", "kw": "跳远"}, {"text": "接力赛开始了！爸爸猪和妈妈猪也加入，大家跑得真开心。", "kw": "接力赛"}, {"text": "最后是拔河比赛。小朋友一队，大人一队，大家一起用力拉绳子。", "kw": "拔河"}, {"text": "运动会结束了，每个人都得到了一枚奖牌。佩奇说：“运动真快乐！”", "kw": "颁奖"}], "id": "peppa_18", "icon": "🐷", "img_prefix": "img/peppa/peppa_18", "audio_prefix": "audio/peppa/peppa_18"}, {"title": "佩奇做三明治", "pages": [{"text": "佩奇和乔治饿了。他们想自己做三明治。", "kw": "hungry"}, {"text": "妈妈猪拿出了面包、生菜和番茄。", "kw": "ingredients"}, {"text": "佩奇小心地涂上黄油。乔治放上生菜。", "kw": "spread"}, {"text": "再加上一片奶酪和番茄。三明治越堆越高啦！", "kw": "tall"}, {"text": "妈妈猪帮忙把三明治切成三角形。", "kw": "cut"}, {"text": "佩奇和乔治大口吃三明治。真是太好吃了！", "kw": "yummy"}], "id": "peppa_19", "icon": "🐷", "img_prefix": "img/peppa/peppa_19", "audio_prefix": "audio/peppa/peppa_19"}, {"title": "告别演出", "pages": [{"text": "佩奇和朋友们要举办一场告别演出。大家都准备了精彩的节目。", "kw": "演出"}, {"text": "小羊苏西跳了一段芭蕾舞。她转了一圈又一圈。", "kw": "芭蕾舞"}, {"text": "小狗丹尼敲起了小鼓，咚咚咚。大家跟着节奏拍手。", "kw": "小鼓"}, {"text": "佩奇表演了吹泡泡。泡泡飘得高高的，真漂亮。", "kw": "泡泡"}, {"text": "最后，大家一起唱了一首歌。歌声又响又快乐。", "kw": "唱歌"}, {"text": "演出结束了，大家都说再见。明年还要一起玩哦！", "kw": "再见"}], "id": "peppa_20", "icon": "🐷", "img_prefix": "img/peppa/peppa_20", "audio_prefix": "audio/peppa/peppa_20"}, {"id": "story1_01", "title": "佩奇的第一天幼儿园", "icon": "🐷", "img_prefix": "img/story1/", "audio_prefix": "audio/story1/", "pages": [{"text": "今天，佩奇要去幼儿园啦！她穿上红色的裙子，背起小书包。", "kw": "school"}, {"text": "羚羊老师笑眯眯地迎接佩奇，带她认识新朋友。", "kw": "teacher"}, {"text": "大家一起玩传球游戏，佩奇跑得很快！", "kw": "game"}, {"text": "小朋友们围坐在一起唱儿歌，佩奇唱得最大声。", "kw": "song"}, {"text": "画画时间到了，佩奇画了一朵大大的太阳花。", "kw": "draw"}, {"text": "午饭香喷喷，佩奇对妈妈说：幼儿园真好玩！", "kw": "goodbye"}]}, {"id": "paw1_01", "title": "汪汪队：大火救援", "icon": "🐶", "img_prefix": "img/paw/", "audio_prefix": "audio/paw/", "pages": [{"text": "莱德和汪汪队在瞭望塔里玩耍。突然，电话铃响了！", "kw": "瞭望塔 着火"}, {"text": "不好了，城中心的大楼着火了！浓烟滚滚。", "kw": "大楼 浓烟"}, {"text": "毛毛跳上消防车，天天开直升机紧紧跟着。", "kw": "消防车 出发"}, {"text": "阿奇疏导人群，路马用水炮对准大火喷水。", "kw": "水炮 灭火"}, {"text": "大家齐心协力浇灭大火，大楼安全了！", "kw": "安全 胜利"}, {"text": "市长给汪汪队颁发奖章，大家都为他们鼓掌！", "kw": "奖章 英雄"}]}, {"id": "judy1_01", "title": "朱迪的交通大救援", "icon": "🐰", "img_prefix": "img/judy/", "audio_prefix": "audio/judy/", "pages": [{"text": "兔子警官朱迪在动物城巡逻，开着警车慢慢地走。", "kw": "巡逻 警车"}, {"text": "哎呀，前面怎么堵车了？长长的车队一动也不动。", "kw": "堵车 喇叭"}, {"text": "朱迪走上前一看，原来是小羊的推车坏了！", "kw": "推车 坏掉"}, {"text": "别着急，我来帮你！朱迪叮叮当当修好了推车。", "kw": "修理 帮助"}, {"text": "朱迪认真地指挥交通，道路恢复了通畅。", "kw": "指挥 通畅"}, {"text": "小羊说谢谢，朱迪笑着说：帮助别人最快乐！", "kw": "谢谢 快乐"}]}, {"id": "idiom_01", "title": "成语：守株待兔", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/01_守株待兔", "pages": [{"text": "【成语】守株待兔\n\n从前有个农夫在田里干活，突然一只兔子撞在树桩上死了。农夫高兴地捡到兔子，从此他不再种地，天天守在树桩旁等兔子。可是再也没有兔子撞上来，他的田地也荒废了。\n\n💡 道理：不要总想着不劳而获，要主动努力，才能得到收获。", "kw": "守株待兔", "img": "img/idioms/01_守株待兔.png", "audio": "audio/idioms/01_守株待兔.mp3"}]}, {"id": "idiom_02", "title": "成语：画龙点睛", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/02_画龙点睛", "pages": [{"text": "【成语】画龙点睛\n\n古代有位画家在墙上画了四条龙，但都没有画眼睛。别人问他为什么，他说画上眼睛龙就会飞走。大家不信，他就给两条龙点上眼睛。突然电闪雷鸣，那两条龙破壁飞上了天。\n\n💡 道理：说话或做事时，关键的一笔能让整体变得生动有力，要抓住最重要的一点。", "kw": "画龙点睛", "img": "img/idioms/02_画龙点睛.png", "audio": "audio/idioms/02_画龙点睛.mp3"}]}, {"id": "idiom_03", "title": "成语：掩耳盗铃", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/03_掩耳盗铃", "pages": [{"text": "【成语】掩耳盗铃\n\n有个人想偷一口大钟，但他搬不动，就想把钟敲碎再拿走。他怕别人听到钟声，就捂住自己的耳朵去敲钟。结果声音传得很远，他立刻被抓住了。\n\n💡 道理：不要自己欺骗自己，明明掩盖不了的事情，偏要想办法掩盖，只会更糟糕。", "kw": "掩耳盗铃", "img": "img/idioms/03_掩耳盗铃.png", "audio": "audio/idioms/03_掩耳盗铃.mp3"}]}, {"id": "idiom_04", "title": "成语：亡羊补牢", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/04_亡羊补牢", "pages": [{"text": "【成语】亡羊补牢\n\n一个牧羊人发现羊圈破了个洞，邻居劝他赶快修，他却说‘羊已经丢了，修也没用’。第二天，又丢了一只羊，他这才后悔，马上把洞补好。从此，羊再也没有丢过。\n\n💡 道理：犯了错误或遇到问题，及时改正弥补，就还不算晚。", "kw": "亡羊补牢", "img": "img/idioms/04_亡羊补牢.png", "audio": "audio/idioms/04_亡羊补牢.mp3"}]}, {"id": "idiom_05", "title": "成语：刻舟求剑", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/05_刻舟求剑", "pages": [{"text": "【成语】刻舟求剑\n\n一个人坐船过河，不小心把剑掉进水里。他马上在船舷上刻了个记号，说‘我的剑是从这里掉下去的’。等船靠岸，他从刻记号的地方下水找剑，却怎么也找不到。\n\n💡 道理：情况变了，办法也要跟着变，不能死守老办法，要懂得灵活处理。", "kw": "刻舟求剑", "img": "img/idioms/05_刻舟求剑.png", "audio": "audio/idioms/05_刻舟求剑.mp3"}]}, {"id": "idiom_06", "title": "成语：拔苗助长", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/06_拔苗助长", "pages": [{"text": "【成语】拔苗助长\n\n古时候有个农夫，嫌禾苗长得太慢，就把每棵苗都往上拔高了一点。他累得满头大汗，回家对儿子说‘今天我帮苗长高了’。儿子跑到田里一看，禾苗全都枯死了。\n\n💡 道理：违反事物的发展规律，急于求成，反而会把事情弄坏。", "kw": "拔苗助长", "img": "img/idioms/06_拔苗助长.png", "audio": "audio/idioms/06_拔苗助长.mp3"}]}, {"id": "idiom_07", "title": "成语：叶公好龙", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/07_叶公好龙", "pages": [{"text": "【成语】叶公好龙\n\n叶公特别喜欢龙，家里到处都画着龙、刻着龙。天上的真龙知道了，很感动，就飞到叶公家里来探望他。叶公一看到真龙，吓得脸色发白，转身就跑。\n\n💡 道理：有的人表面上喜欢某样东西，其实并不是真的喜欢，只是做样子罢了。", "kw": "叶公好龙", "img": "img/idioms/07_叶公好龙.png", "audio": "audio/idioms/07_叶公好龙.mp3"}]}, {"id": "idiom_08", "title": "成语：狐假虎威", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/08_狐假虎威", "pages": [{"text": "【成语】狐假虎威\n\n老虎抓住一只狐狸，狐狸说‘你不能吃我，我是百兽之王’。老虎不信，狐狸就带着老虎在森林里走了一圈。小动物们看见老虎，都吓得逃跑了，狐狸却说是被自己吓跑的。\n\n💡 道理：借着别人的力量来吓唬人，自己其实并没有真本事，这种人很可笑。", "kw": "狐假虎威", "img": "img/idioms/08_狐假虎威.png", "audio": "audio/idioms/08_狐假虎威.mp3"}]}, {"id": "idiom_09", "title": "成语：井底之蛙", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/09_井底之蛙", "pages": [{"text": "【成语】井底之蛙\n\n一只青蛙住在井里，以为天空只有井口那么大。有一天，大海龟路过井口，青蛙得意地夸自己的井底世界。海龟告诉它大海有多么辽阔，青蛙听了，惊讶得说不出话来。\n\n💡 道理：眼光狭小，见识短浅，还自以为了不起，要多出去看看更广阔的世界。", "kw": "井底之蛙", "img": "img/idioms/09_井底之蛙.png", "audio": "audio/idioms/09_井底之蛙.mp3"}]}, {"id": "idiom_10", "title": "成语：对牛弹琴", "icon": "📚", "type": "idiom", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/10_对牛弹琴", "pages": [{"text": "【成语】对牛弹琴\n\n古代有位音乐家，对着牛弹起高雅的曲子。他弹得非常投入，可是牛却只顾低头吃草，一点反应都没有。音乐家这才明白，不是弹得不好，是牛根本听不懂。\n\n💡 道理：说话做事要看对象，对不懂道理的人讲道理，是白费力气。", "kw": "对牛弹琴", "img": "img/idioms/10_对牛弹琴.png", "audio": "audio/idioms/10_对牛弹琴.mp3"}]}, {"id": "poem_11", "title": "古诗：静夜思", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/11_静夜思", "pages": [{"text": "《静夜思》\n李白 · 唐\n\n床前明月光，疑是地上霜。举头望明月，低头思故乡。\n\n📖 明亮的月光照在床前，好像地上铺了一层白霜。我抬头看看天上的月亮，不由得低下头，想念起远方的家乡。", "kw": "李白", "img": "img/idioms/11_静夜思.png", "audio": "audio/idioms/11_静夜思.mp3"}]}, {"id": "poem_12", "title": "古诗：春晓", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/12_春晓", "pages": [{"text": "《春晓》\n孟浩然 · 唐\n\n春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。\n\n📖 春天睡懒觉，不知不觉天就亮了，到处都能听到小鸟在唱歌。想起昨晚的风雨声，不知道美丽的花儿落了多少片。", "kw": "孟浩然", "img": "img/idioms/12_春晓.png", "audio": "audio/idioms/12_春晓.mp3"}]}, {"id": "poem_13", "title": "古诗：咏鹅", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/13_咏鹅", "pages": [{"text": "《咏鹅》\n骆宾王 · 唐\n\n鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。\n\n📖 大白鹅弯着脖子朝天叫，好像在唱歌。它雪白的羽毛浮在绿色的水面上，红色的脚掌轻轻地划着清清的水波。", "kw": "骆宾王", "img": "img/idioms/13_咏鹅.png", "audio": "audio/idioms/13_咏鹅.mp3"}]}, {"id": "poem_14", "title": "古诗：登鹳雀楼", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/14_登鹳雀楼", "pages": [{"text": "《登鹳雀楼》\n王之涣 · 唐\n\n白日依山尽，黄河入海流。欲穷千里目，更上一层楼。\n\n📖 太阳靠着山边慢慢落下，黄河水滚滚地向大海流去。想要看得更远更远，那就要再登上一层高楼。", "kw": "王之涣", "img": "img/idioms/14_登鹳雀楼.png", "audio": "audio/idioms/14_登鹳雀楼.mp3"}]}, {"id": "poem_15", "title": "古诗：悯农", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/15_悯农", "pages": [{"text": "《悯农》\n李绅 · 唐\n\n锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。\n\n📖 农民伯伯在中午大太阳下给禾苗松土，汗水一滴一滴掉进泥土里。谁能想到碗里的米饭，每一粒都是用辛苦换来的呀。", "kw": "李绅", "img": "img/idioms/15_悯农.png", "audio": "audio/idioms/15_悯农.mp3"}]}, {"id": "poem_16", "title": "古诗：望庐山瀑布", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/16_望庐山瀑布", "pages": [{"text": "《望庐山瀑布》\n李白 · 唐\n\n日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。\n\n📖 阳光照着香炉峰，升起紫色的烟雾，远远看去，瀑布像一条白布挂在山前。水流从很高很高的地方飞下来，真让人以为是天上的银河掉下来了。", "kw": "李白", "img": "img/idioms/16_望庐山瀑布.png", "audio": "audio/idioms/16_望庐山瀑布.mp3"}]}, {"id": "poem_17", "title": "古诗：村居", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/17_村居", "pages": [{"text": "《村居》\n高鼎 · 清\n\n草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。\n\n📖 二月里小草长出来了，黄莺鸟飞来飞去，杨柳轻轻拂着堤岸，春天的雾气让人陶醉。小朋友们放学回来得早，赶紧趁着东风放起了风筝。", "kw": "高鼎", "img": "img/idioms/17_村居.png", "audio": "audio/idioms/17_村居.mp3"}]}, {"id": "poem_18", "title": "古诗：所见", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/18_所见", "pages": [{"text": "《所见》\n袁枚 · 清\n\n牧童骑黄牛，歌声振林樾。意欲捕鸣蝉，忽然闭口立。\n\n📖 放牛的小娃娃骑在黄牛背上，响亮的歌声在树林里回荡。他忽然想捉树上叫个不停的知了，就马上闭上嘴巴，一声不响地站住了。", "kw": "袁枚", "img": "img/idioms/18_所见.png", "audio": "audio/idioms/18_所见.mp3"}]}, {"id": "poem_19", "title": "古诗：小池", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/19_小池", "pages": [{"text": "《小池》\n杨万里 · 宋\n\n泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。\n\n📖 细细的泉水舍不得流走，树荫映在水面上，喜欢晴朗柔和的天气。小小的荷叶刚刚露出尖尖的角，已经有蜻蜓飞过来，停在了上面。", "kw": "杨万里", "img": "img/idioms/19_小池.png", "audio": "audio/idioms/19_小池.mp3"}]}, {"id": "poem_20", "title": "古诗：赠汪伦", "icon": "📜", "type": "poem", "img_prefix": "img/idioms/", "audio_prefix": "audio/idioms/20_赠汪伦", "pages": [{"text": "《赠汪伦》\n李白 · 唐\n\n李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。\n\n📖 我坐着小船正要出发，忽然听到岸上传来好朋友汪伦边走边唱的声音。桃花潭的水虽然很深很深，但比不上汪伦送我的情谊那样深。", "kw": "李白", "img": "img/idioms/20_赠汪伦.png", "audio": "audio/idioms/20_赠汪伦.mp3"}]}];
    }
    return stories;
  }

  openStory(idx) {
    const stories = this._allStories || STORIES;
    const s = stories[idx];
    this._storyIdx = idx;
    this._storyPage = 0;
    const c = document.getElementById('story-content');
    const imgP = s.img_prefix || `img/${s.id}/`;
    const audP = s.audio_prefix || `audio/${s.id}/`;
    
    // Store raw data for rendering
    this._storyData = { story:s, imgP, audP };
    
    // Build pages with explicit img and audio
    const pages = (s.pages || []).map((p, i) => {
      const imgFile = i === 0 ? 'cover.png' : `page${i}.png`;
      const audFile = `page${i+1}_zh.mp3`;
      return {
        text: p.text || p.text_zh || '',
        img: imgP + imgFile,
        audio: audP + audFile
      };
    });
    
    this._storyPages = pages;
    this._renderBook();
  }

  _renderBook() {
    const s = this._storyData.story;
    const p = this._storyPage;
    const pages = this._storyPages;
    const page = pages[p];
    const total = pages.length;
    const c = document.getElementById('story-content');
    
    c.innerHTML = `<div class="quiz-area" style="padding:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <button class="btn-back" onclick="app.renderStory()">📚 书库</button>
        <span style="font-weight:800;color:#FF6B8A;">📖 ${s.title}</span>
        <span style="font-size:13px;color:#888;">${p+1}/${total}</span>
      </div>
      <div class="book-wrapper">
        <div class="book-spread">
          <div class="book-left" onclick="app.bookSpeak()" style="cursor:pointer;">
            <img src="${page.img}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22400%22><rect fill=%22%23F0EDE5%22 width=%22320%22 height=%22400%22/><text x=%22160%22 y=%22200%22 text-anchor=%22middle%22 fill=%22%23CCC%22 font-size=%2218%22>插图</text></svg>';">
          </div>
          <div class="book-right">
            <div class="text-area">${page.text}</div>
            <div class="book-page-num">${p+1}</div>
          </div>
        </div>
      </div>
      <div class="book-nav">
        <button ${p===0?'disabled':''} onclick="app.bookPrev()">◀ 上一页</button>
        <button ${p>=total-1?'disabled':''} onclick="app.bookNext()">下一页 ▶</button>
      </div>
    </div>`;
  }

  bookNext() {
    if (this._storyPage < this._storyPages.length - 1) {
      this._storyPage++;
      this._renderBook();
      setTimeout(()=>this.bookSpeak(), 400);
    }
  }

  bookPrev() {
    if (this._storyPage > 0) {
      this._storyPage--;
      this._renderBook();
    }
  }

  bookSpeak() {
    const page = this._storyPages[this._storyPage];
    if (page?.audio) {
      this.audio.cancel();
      const a = new Audio(page.audio);
      a.play().catch(e => console.log('Audio play failed:', e));
    }
  }

  // ==================== GENERAL KNOWLEDGE ====================
  showGeneralTab(tab) {
    this.audio.cancel();
    this.state.generalTab = tab;
    this.renderGeneralTab();
  }

  renderGeneralTab() {
    const t = this.state.generalTab;
    const c = document.getElementById('general-content');
    if (t === 'safety') this.renderVocab(c, SAFETY);
    else if (t === 'science') this.renderVocab(c, SCIENCE);
    else if (t === 'spotdiff') this.renderSpotDiff(c);
    else if (t === 'drawing') this.renderDrawing(c);
  }

  // ============== PHONICS ==============
  renderPhonics(container) {
    let h = '<div class="cards-grid">';
    PHONICS_LETTERS.forEach(p => {
      h += `<div class="item-card" data-speak="${p.l}发${p.s}音，${p.w}${p.c}" data-speak-en="${p.s} as in ${p.w}" style="min-height:130px;">
        <span class="speaker-hint">🔊</span>
        <div class="letter" style="color:${this.letterColor(p.l)};font-size:32px;">${p.l}</div>
        <div style="font-size:16px;color:var(--orange);font-weight:700;">${p.s}</div>
        <div class="emoji-block" style="font-size:24px;">${p.e}</div>
        <div style="font-size:13px;">${p.w} <span style="color:#888;">${p.c}</span></div>
        <div style="font-size:11px;color:#AAA;margin-top:2px;">👄 ${p.h}</div>
      </div>`;
    });
    h += '</div>';
    container.innerHTML = h;
  }

  // ============== CLOCK ==============
  renderClock(container) {
    const h = Math.floor(Math.random()*12)+1;
    const m = Math.random()>0.4 ? 0 : 30;
    const correct = m===0 ? `${h}点` : `${h}点半`;
    const opts = new Set(); opts.add(correct);
    while(opts.size < 4) {
      const rh = Math.floor(Math.random()*12)+1;
      const rm = Math.random()>0.5 ? 0 : 30;
      opts.add(rm===0 ? `${rh}点` : `${rh}点半`);
    }
    const optsArr = [...opts].sort(()=>Math.random()-0.5);
    this._clockData = {h, m, correct};

    container.innerHTML = `<div class="quiz-area">
      <h3>🕐 认识钟表</h3>
      <canvas id="clockCanvas" width="220" height="220" style="margin:8px auto;display:block;"></canvas>
      <div style="font-size:12px;color:#888;">时针短，分针长</div>
      <div class="quiz-options" style="flex-wrap:wrap;">${optsArr.map(o=>`<button class="quiz-option" style="width:auto;padding:8px 16px;border-radius:20px;font-size:15px;" onclick="app.checkClock('${o}',this)">${o}</button>`).join('')}</div>
      <div class="quiz-feedback" id="clockFeedback"></div>
      <button class="btn-next" onclick="app.renderMathTab()" style="display:none" id="clockNext">再来一题 ⭐</button>
    </div>`;
    setTimeout(()=>this.drawClock(),50);
  }

  drawClock() {
    const c = document.getElementById('clockCanvas');
    if (!c) return;
    const ctx = c.getContext('2d');
    const cx=110, cy=110, r=95;
    ctx.clearRect(0,0,220,220);
    // face
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#FFFEF0'; ctx.fill(); ctx.strokeStyle='#CCC'; ctx.lineWidth=3; ctx.stroke();
    // ticks
    for (let i=0; i<12; i++) {
      const a = (i-3)*Math.PI/6;
      const outer = i%3===0 ? r-14 : r-8;
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(r-4), cy+Math.sin(a)*(r-4));
      ctx.lineTo(cx+Math.cos(a)*outer, cy+Math.sin(a)*outer);
      ctx.strokeStyle=i%3===0?'#333':'#AAA'; ctx.lineWidth=i%3===0?3:1.5; ctx.stroke();
      if (i%3===0) { ctx.fillStyle='#333'; ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(i===0?'12':''+i, cx+Math.cos(a)*(r-26), cy+Math.sin(a)*(r-26)); }
    }
    // hands
    const d = this._clockData;
    const ha = ((d.h%12)+d.m/60-3)*Math.PI/6;
    const ma = (d.m/60*12-3)*Math.PI/6;
    ctx.strokeStyle='#333'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ha)*45, cy+Math.sin(ha)*45); ctx.stroke();
    ctx.strokeStyle='#666'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ma)*70, cy+Math.sin(ma)*70); ctx.stroke();
    // center

  initDrawing() {
    const canvas = document.getElementById('drawCanvas');
    if (!canvas || canvas._inited) return;
    canvas._inited = true;
    this._drawCtx = canvas.getContext('2d');
    this._drawCanvas = canvas;
    this._drawState = { color:'#FF3B30', size:12, mode:'fill', drawing:false, templateImg:null, undoStack:[] };

    const doFloodFill = (x, y) => {
      const ctx = this._drawCtx;
      const w = canvas.width, h = canvas.height;
      const imageData = ctx.getImageData(0, 0, w, h);
      const pixels = imageData.data;
      
      const px = Math.floor(x), py = Math.floor(y);
      if (px < 0 || px >= w || py < 0 || py >= h) return;
      
      const idx = (py * w + px) * 4;
      const targetR = pixels[idx], targetG = pixels[idx+1], targetB = pixels[idx+2];
      const fillHex = this._drawState.color;
      const fillR = parseInt(fillHex.slice(1,3),16);
      const fillG = parseInt(fillHex.slice(3,5),16);
      const fillB = parseInt(fillHex.slice(5,7),16);
      
      // Don't fill if clicking on outline (dark pixels) or already the target color
      const isDark = (targetR < 80 && targetG < 80 && targetB < 80);
      if (isDark) return;
      if (Math.abs(targetR - fillR) < 5 && Math.abs(targetG - fillG) < 5 && Math.abs(targetB - fillB) < 5) return;
      
      // Save undo state
      const undoData = ctx.getImageData(0, 0, w, h);
      this._drawState.undoStack.push(undoData);
      if (this._drawState.undoStack.length > 20) this._drawState.undoStack.shift();
      
      // Flood fill BFS
      const queue = [[px, py]];
      const visited = new Uint8Array(w * h);
      const tolerance = 25;
      let filled = 0, maxFill = 80000;
      
      while (queue.length > 0 && filled < maxFill) {
        const [cx, cy] = queue.shift();
        const ci = cy * w + cx;
        if (visited[ci]) continue;
        const pi = ci * 4;
        const pr = pixels[pi], pg = pixels[pi+1], pb = pixels[pi+2];
        if (Math.abs(pr - targetR) > tolerance || Math.abs(pg - targetG) > tolerance || Math.abs(pb - targetB) > tolerance) continue;
        visited[ci] = 1; filled++;
        pixels[pi] = Math.round(fillR * 0.55 + pr * 0.45);
        pixels[pi+1] = Math.round(fillG * 0.55 + pg * 0.45);
        pixels[pi+2] = Math.round(fillB * 0.55 + pb * 0.45);
        if (cx > 0) queue.push([cx-1, cy]);
        if (cx < w-1) queue.push([cx+1, cy]);
        if (cy > 0) queue.push([cx, cy-1]);
        if (cy < h-1) queue.push([cx, cy+1]);
      }
      
      ctx.putImageData(imageData, 0, 0);
    };
    
    const doBrush = (x, y, isDown) => {
      const ctx = this._drawCtx;
      ctx.beginPath();
      ctx.arc(x, y, this._drawState.size, 0, Math.PI*2);
      ctx.fillStyle = this._drawState.color;
      ctx.fill();
    };

    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (this._drawState.mode === 'fill') {
        doFloodFill(x, y);
      }
    };
    // Mobile fill support (touch without brush drag)
    let touchStartTime = 0, touchMoved = false;
    canvas.addEventListener('touchstart', e => {
      touchStartTime = Date.now(); touchMoved = false;
      const rect = canvas.getBoundingClientRect();
      this._touchStartX = e.touches[0].clientX - rect.left;
      this._touchStartY = e.touches[0].clientY - rect.top;
      if (this._drawState.mode === 'brush') {
        e.preventDefault();
        brushDown = true;
        const undoData = this._drawCtx.getImageData(0, 0, canvas.width, canvas.height);
        this._drawState.undoStack.push(undoData);
        doBrush(this._touchStartX, this._touchStartY);
      }
    });
    canvas.addEventListener('touchmove', e => {
      touchMoved = true;
      if (this._drawState.mode !== 'brush') return;
      e.preventDefault();
      if (!brushDown) return;
      const rect = canvas.getBoundingClientRect();
      doBrush(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
    });
    canvas.addEventListener('touchend', e => {
      if (this._drawState.mode === 'fill' && !touchMoved && Date.now() - touchStartTime < 300) {
        doFloodFill(this._touchStartX, this._touchStartY);
      }
      brushDown = false;
    });
    
    // Desktop brush support
    let brushDown = false;
    canvas.addEventListener('mousedown', e => {
      if (this._drawState.mode !== 'brush') return;
      brushDown = true;
      const rect = canvas.getBoundingClientRect();
      const undoData = this._drawCtx.getImageData(0, 0, canvas.width, canvas.height);
      this._drawState.undoStack.push(undoData);
      doBrush(e.clientX - rect.left, e.clientY - rect.top);
    });
    canvas.addEventListener('mousemove', e => {
      if (!brushDown) return;
      doBrush(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top);
    });
    canvas.addEventListener('mouseup', () => brushDown = false);
    canvas.addEventListener('mouseleave', () => brushDown = false);
    
    this.drawClear();
  }

  drawUndo() {
    if (!this._drawState.undoStack.length) return;
    const data = this._drawState.undoStack.pop();
    this._drawCtx.putImageData(data, 0, 0);
    if (!this._drawState.undoStack.length) {
      document.getElementById('undoBtn').style.opacity = '0.5';
    }
  }

  drawClear() {
    const canvas = this._drawCanvas;
    const ctx = this._drawCtx;
    if (!ctx || !canvas) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (this._drawState.templateImg) {
      ctx.drawImage(this._drawState.templateImg, 0, 0, canvas.width, canvas.height);
    }
    this._drawState.undoStack = [];
    document.getElementById('undoBtn') && (document.getElementById('undoBtn').style.opacity = '0.5');
  }

        <div class="quiz-score">⭐ 得分: ${this.state.quizScore} / ${this.state.quizTotal || 1}</div>
        <div style="font-size:22px;margin:12px 0;color:#666;">
          ${q.type==='emoji' ? '看到这个，它的英文是什么？' : '这个英文单词是什么意思？'}
        </div>
        ${q.type==='emoji' ? `<div style="font-size:64px;margin:12px 0;">${q.display}</div>` : `<div style="font-size:34px;font-weight:700;color:var(--blue);margin:12px 0;">${q.display}</div>`}
        <div class="quiz-options" style="flex-wrap:wrap;">
          ${q.options.map((o,i) => `<button class="quiz-option" style="width:auto;padding:10px 20px;border-radius:20px;font-size:15px;" data-idx="${i}" onclick="app.answerEnglishQuiz(${i},this)">${o}</button>`).join('')}
        </div>
        <div class="quiz-feedback" id="engFeedback"></div>
        <button class="btn-next" onclick="app.nextEnglishQuiz()" style="display:none" id="engNext">下一题 ⭐</button>
      </div>`;
  }

  generateEnglishQuestion() {
    const allWords = [...ANIMALS, ...FRUITS, ...BODY, ...FOODS, ...FAMILY, ...ACTIONS, ...WEATHER, ...TRANSPORT, ...SHAPES, ...PLACES, ...DAYS, ...COLORS];
    const correct = allWords[Math.floor(Math.random()*allWords.length)];
    const wrongPool = allWords.filter(w => w.w !== correct.w);
    const wrongs = [];
    const pool = [...wrongPool];
    for (let i=0; i<3 && pool.length>0; i++) {
      const idx = Math.floor(Math.random()*pool.length);
      wrongs.push(pool.splice(idx,1)[0]);
    }

    const type = Math.random() > 0.5 ? 'emoji' : 'word';
    let display, correctAnswer, options;
    if (type === 'emoji') {
      display = correct.e;
      correctAnswer = correct.w;
      options = [correct.w, ...wrongs.map(w=>w.w)];
    } else {
      display = correct.w;
      correctAnswer = correct.c;
      options = [correct.c, ...wrongs.map(w=>w.c)];
    }
    options = options.sort(()=>Math.random()-0.5);

    this.state.quizQuestion = { type, display, correctAnswer, options, correctIndex:options.indexOf(correctAnswer) };
    this.state.quizAnswered = false;
  }

  answerEnglishQuiz(idx, btn) {
    if (this.state.quizAnswered) return;
    this.state.quizAnswered = true;
    this.state.quizTotal++;
    const q = this.state.quizQuestion;
    document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
    const fb = document.getElementById('engFeedback');
    const next = document.getElementById('engNext');
    if (idx === q.correctIndex) {
      btn.classList.add('correct');
      fb.textContent = '🎉 正确！';
      fb.style.color = '#34C759';
      this.state.quizScore++;
      this.audio.speak('答对了！');
      this.celebrate();
    } else {
      btn.classList.add('wrong');
      fb.textContent = `😊 正确答案是：${q.correctAnswer}`;
      fb.style.color = '#FF9500';
      this.audio.speak(`正确答案是${q.correctAnswer}`);
      document.querySelectorAll('.quiz-option').forEach(b => {
        if (parseInt(b.dataset.idx) === q.correctIndex) b.classList.add('correct');
      });
    }
    next.style.display = 'inline-block';
  }

  nextEnglishQuiz() {
    this.state.quizAnswered = false;
    this.generateEnglishQuestion();
    this.renderEnglishTab();
  }

  // ==================== CELEBRATION ====================
  celebrate() {
    const container = document.createElement('div');
    container.className = 'celebration';
    const emojis = ['🎉','⭐','🌟','💖','🎊','✨','👏','🏆','🥇','💯'];
    for (let i=0; i<15; i++) {
      const el = document.createElement('span');
      el.className = 'emoji';
      el.textContent = emojis[i%emojis.length];
      el.style.setProperty('--dx', (Math.random()*300-150)+'px');
      el.style.setProperty('--dy', (-100-Math.random()*200)+'px');
      el.style.setProperty('--dr', (Math.random()*720-360)+'deg');
      el.style.left = (40+Math.random()*20)+'%';
      el.style.top = (40+Math.random()*20)+'%';
      el.style.animationDelay = Math.random()*0.3+'s';
      el.style.animationDuration = (1+Math.random()*1.5)+'s';
      container.appendChild(el);
    }
    document.body.appendChild(container);
    setTimeout(() => container.remove(), 2000);
  }
}

// ==================== BOOT ====================
const app = new EduApp();
</script>
</body>
