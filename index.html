<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>宝宝启蒙学习</title>
<style>
:root {
  --pink: #FF6B8A; --blue: #4DA6FF; --green: #34C759; --orange: #FF9500;
  --purple: #AF52DE; --yellow: #FFD60A; --teal: #5AC8FA; --text: #2D3436;
  --text2: #636E72; --bg: #F8FAFB; --radius: 20px; --radius-sm: 14px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(160deg, #F0F4FF 0%, #FFF0F5 30%, #F5FFF0 60%, #FFF8F0 100%);
  background-attachment: fixed;
  min-height: 100dvh; overflow-x: hidden; color: var(--text);
  -webkit-tap-highlight-color: transparent; user-select: none;
}
/* Subtle floating orbs */
body::before, body::after {
  content:''; position:fixed; border-radius:50%; pointer-events:none; z-index:0; opacity:0.08;
  animation: orbFloat 60s ease-in-out infinite;
}
body::before { width:400px;height:400px;background:var(--blue);top:-100px;left:-100px;animation-delay:0s; }
body::after  { width:350px;height:350px;background:var(--pink);bottom:-80px;right:-80px;animation-delay:-30s; }
@keyframes orbFloat { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(40px,30px) scale(1.15); } }

/* Floating emojis */
.floaties { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
.floaty { position:absolute; opacity:0.08; animation: floatUp linear infinite; }
@keyframes floatUp { 0% { transform:translateY(110vh) rotate(0deg); opacity:0.04; } 50% { opacity:0.1; } 100% { transform:translateY(-10vh) rotate(360deg); opacity:0.03; } }

/* App Container */
#app { position:relative; z-index:2; max-width:840px; margin:0 auto; padding:12px 16px 32px; min-height:100dvh; }

/* Header */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background:rgba(255,255,255,0.82);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-radius:var(--radius); margin-bottom:14px;
  box-shadow:var(--shadow); border:1px solid rgba(255,255,255,0.6);
}
.header h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px;
  background:linear-gradient(135deg, #FF6B8A 0%, #AF52DE 50%, #4DA6FF 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.header .actions { display:flex; gap:8px; }
.btn-icon {
  width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,0.06);
  background:rgba(255,255,255,0.9);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.btn-icon:hover { background:var(--blue); color:white; border-color:var(--blue); transform:scale(1.08); }
.btn-icon:active { transform:scale(0.94); }

/* Content */
.content { display:flex; flex-direction:column; gap:14px; }
.page { display:none; animation: fadeSlideIn 0.3s ease; }
.page.active { display:flex; flex-direction:column; gap:14px; }
@keyframes fadeSlideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* Home Cards */
.home-cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; }
.home-card {
  background:white; border-radius:var(--radius); padding:40px 28px;
  text-align:center; cursor:pointer; box-shadow:var(--shadow);
  transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
  position:relative; overflow:hidden; border:2px solid transparent;
}
.home-card::after {
  content:''; position:absolute; inset:0; opacity:0; transition:opacity 0.35s;
  border-radius:var(--radius); pointer-events:none;
}
.home-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-lg); border-color:rgba(0,0,0,0.06); }
.home-card:hover::after { opacity:0.04; background:linear-gradient(135deg,var(--blue),var(--purple)); }
.home-card:active { transform:scale(0.97); }
.home-card .icon { font-size:72px; margin-bottom:14px; display:block; animation: bounce 2s infinite; }
.home-card:hover .icon { animation: bounce 0.6s infinite; }
@keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
.home-card .title { font-size:24px; font-weight:800; margin-bottom:6px; }
.home-card .subtitle { font-size:14px; color:var(--text2); }
.home-card.math { background:linear-gradient(135deg,#FFF5F7,#FFF8F0); border-color:rgba(255,107,138,0.15); }
.home-card.english { background:linear-gradient(135deg,#F0F5FF,#F5F0FF); border-color:rgba(77,166,255,0.15); }

/* Sub menu cards */
.sub-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; }
.sub-card {
  background:white; border-radius:var(--radius-sm); padding:18px 10px;
  text-align:center; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:all 0.25s; border:2px solid transparent;
  position:relative; overflow:hidden;
}
.sub-card::before { content:''; position:absolute; left:0;top:0;bottom:0;width:3px;border-radius:3px;opacity:0;transition:opacity 0.25s; }
.sub-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:rgba(0,0,0,0.08); }
.sub-card:hover::before { opacity:1; }
.sub-card:nth-child(5n+1)::before { background:var(--pink); }
.sub-card:nth-child(5n+2)::before { background:var(--blue); }
.sub-card:nth-child(5n+3)::before { background:var(--green); }
.sub-card:nth-child(5n+4)::before { background:var(--orange); }
.sub-card:nth-child(5n+5)::before { background:var(--purple); }
.sub-card:active { transform:scale(0.95); }
.sub-card .icon { font-size:34px; display:block; margin-bottom:6px; }
.sub-card .label { font-size:14px; font-weight:700; color:var(--text); }

/* Item Cards Grid */
.cards-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(105px,1fr)); gap:10px; }
.item-card {
  background:white; border-radius:var(--radius-sm); padding:16px 10px;
  text-align:center; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:all 0.28s cubic-bezier(0.4,0,0.2,1); position:relative; overflow:hidden;
  border:2px solid transparent;
}
.item-card:hover { transform:translateY(-4px) scale(1.02); box-shadow:var(--shadow-lg); border-color:#E8ECF1; }
.item-card:active { transform:scale(0.94); }
.item-card .num { font-size:34px; font-weight:800; margin-bottom:2px; }
.item-card .cn { font-size:14px; color:var(--text2); margin-bottom:1px; }
.item-card .en { font-size:12px; color:#B0B8C1; }
.item-card .emoji-block { font-size:20px; margin-top:6px; line-height:1.4; }
.item-card .word { font-size:16px; font-weight:700; margin-bottom:2px; }
.item-card .meaning { font-size:13px; color:var(--text2); }
.item-card .letter { font-size:38px; font-weight:900; }
.item-card .speaker-hint {
  position:absolute; top:6px; right:6px; font-size:13px;
  opacity:0.25; transition:opacity 0.2s;
}
.item-card:hover .speaker-hint { opacity:1; }
.item-card.speaking { border-color:var(--orange) !important; animation:pulse 0.7s ease-in-out infinite; box-shadow:0 0 0 4px rgba(255,149,0,0.12) !important; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 4px rgba(255,149,0,0.12); } 50% { box-shadow:0 0 0 14px rgba(255,149,0,0.04); } }

/* Quiz Section */
.quiz-area { background:white; border-radius:var(--radius); padding:30px 22px; box-shadow:var(--shadow); text-align:center; }
.quiz-area h3 { font-size:20px; font-weight:800; margin-bottom:14px; color:var(--text); }
.quiz-visual { font-size:52px; margin:18px 0; letter-spacing:6px; }
.quiz-equation { font-size:34px; font-weight:800; margin:14px 0; }
.quiz-options { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px; }
.quiz-option {
  min-width:60px; height:60px; border-radius:30px; border:3px solid #E8ECF1;
  background:white; font-size:22px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  padding:0 14px; transition:all 0.2s; color:var(--text);
}
.quiz-option:hover { border-color:var(--blue); transform:translateY(-2px); background:#F5F9FF; }
.quiz-option:active { transform:scale(0.92); }
.quiz-option.correct { background:#E8FFEE !important; border-color:var(--green) !important; color:var(--green); }
.quiz-option.wrong { background:#FFF0F0 !important; border-color:#FF6B8A !important; color:#FF6B8A; }
.quiz-feedback { font-size:26px; margin-top:14px; min-height:40px; font-weight:800; }
.quiz-score { font-size:15px; color:var(--text2); margin-top:8px; font-weight:600; }
.btn-next {
  margin-top:16px; padding:12px 36px; border-radius:30px; border:none;
  background:linear-gradient(135deg, #4DA6FF, #AF52DE);
  color:white; font-size:16px; font-weight:700; cursor:pointer;
  transition:all 0.25s; box-shadow:0 4px 16px rgba(77,166,255,0.3);
}
.btn-next:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(77,166,255,0.4); }
.btn-next:active { transform:scale(0.95); }

/* Back button */
.btn-back {
  display:inline-flex; align-items:center; gap:6px; padding:8px 18px;
  border-radius:24px; border:1px solid rgba(0,0,0,0.08); background:white;
  font-size:14px; font-weight:700; cursor:pointer; transition:all 0.2s;
  box-shadow:var(--shadow-sm); color:var(--text);
}
.btn-back:hover { background:#F8F9FA; transform:translateY(-1px); }
.btn-back:active { transform:scale(0.96); }

/* Celebration */
.celebration { position:fixed; inset:0; pointer-events:none; z-index:999; display:flex; align-items:center; justify-content:center; }
.celebration .emoji { position:absolute; font-size:44px; animation:confetti 1.8s ease-out forwards; }
@keyframes confetti { 0% { transform:translate(0,0) scale(0) rotate(0deg); opacity:1; } 100% { transform:translate(var(--dx),var(--dy)) scale(1.6) rotate(var(--dr)); opacity:0; } }

/* Canvas */
.trace-canvas { border:3px dashed #DDD; border-radius:16px; cursor:crosshair; background:#FFFFF0; }
.trace-controls { display:flex; gap:8px; }
.trace-controls button { padding:8px 18px; border-radius:20px; border:none; background:#F0F2F4; font-size:13px; cursor:pointer; font-weight:700; transition:all 0.2s; }
.trace-controls button:hover { background:#E0E4E8; }
.color-swatch { width:56px; height:56px; border-radius:50%; margin:8px auto; border:3px solid #EEE; box-shadow:0 2px 8px rgba(0,0,0,0.06); }

/* Spot diff */
.spot-area { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
.spot-label { text-align:center; font-size:13px; color:var(--text2); margin-bottom:4px; font-weight:600; }
.spot-score { font-size:18px; font-weight:800; color:var(--orange); margin:10px 0; }
.spot-area img { max-width:100%; }

/* Drawing */
.draw-toolbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center; padding:8px 0; }
.draw-color { width:32px; height:32px; border-radius:50%; border:3px solid #E0E4E8; cursor:pointer; transition:all 0.2s; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
.draw-color:hover { transform:scale(1.2); }
.draw-color.active { border-color:#333; box-shadow:0 0 0 3px rgba(0,0,0,0.15); }
.draw-size-btn {
  padding:5px 14px; border-radius:18px; border:2px solid #E0E4E8; background:white;
  cursor:pointer; font-size:13px; font-weight:700; transition:all 0.2s;
}
.draw-size-btn:hover { border-color:var(--blue); background:#F5F9FF; }
.draw-size-btn.active { border-color:var(--blue); background:#E8F2FF; color:var(--blue); }
.draw-canvas-wrap { border:3px solid #E8ECF1; border-radius:16px; overflow:hidden; background:white; display:inline-block; box-shadow:var(--shadow-sm); }

/* Book Reader Layout */
.book-wrapper { max-width:760px; margin:0 auto; }
.book-spread { display:flex; min-height:440px; border-radius:16px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.1); }
.book-left { flex:1; background:#F8F6F0; position:relative; border-right:2px solid #E8E0D0; min-width:0; }
.book-right { flex:1; background:#FFFEF8; position:relative; min-width:0; }
.book-left img { width:100%; height:100%; object-fit:cover; display:block; }
.book-right .text-area { padding:28px 24px; font-size:18px; line-height:2.2; color:#3D3226; height:100%; overflow-y:auto; }
.book-page-num { position:absolute; bottom:10px; right:14px; font-size:12px; color:#BBB; }
@media (max-width:600px) { .book-spread { flex-direction:column; min-height:auto; } .book-left { height:240px; border-right:none; border-bottom:2px solid #E8E0D0; } }

/* ===== V4 Enhancements ===== */
/* 3D card tilt */
.home-card { perspective:600px; }
.home-card::before {
  content:''; position:absolute; inset:0; border-radius:var(--radius);
  background:radial-gradient(circle at 50% 0%, rgba(255,255,255,0.5), transparent 70%);
  opacity:0; transition:opacity 0.4s; pointer-events:none; z-index:1;
}
.home-card:hover::before { opacity:1; }
/* Glossy sweep on item cards */
.item-card::after {
  content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
  background:linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
  transform:translateX(-100%); transition:transform 0.6s;
}
.item-card:hover::after { transform:translateX(100%); }
/* Quiz option fill-up */
.quiz-option {
  position:relative; overflow:hidden; z-index:0;
}
.quiz-option::before {
  content:''; position:absolute; bottom:0; left:0; right:0; height:0;
  background:linear-gradient(to top, rgba(77,166,255,0.12), transparent);
  transition:height 0.3s; z-index:-1; border-radius:30px;
}
.quiz-option:hover::before { height:100%; }
.quiz-option.correct { animation: correctShake 0.5s ease; }
@keyframes correctShake {
  0%,100%{transform:scale(1)}
  25%{transform:scale(1.08) rotate(-2deg)}
  75%{transform:scale(1.08) rotate(2deg)}
}
/* Button shimmer */
.btn-next {
  position:relative; overflow:hidden;
}
.btn-next::after {
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  transition:left 0.5s;
}
.btn-next:hover::after { left:100%; }

@media (max-width:600px) {
  .home-cards { grid-template-columns:1fr; }
  .sub-cards { grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:8px; }
  .cards-grid { grid-template-columns:repeat(auto-fill, minmax(85px,1fr)); gap:8px; }
  .item-card { padding:12px 8px; border-radius:12px; }
  .item-card .num { font-size:26px; }
  .item-card .letter { font-size:30px; }
  .quiz-option { min-width:50px; height:50px; font-size:18px; padding:0 10px; }
  .header h1 { font-size:20px; }
  .home-card { padding:28px 20px; }
  .home-card .icon { font-size:56px; }
  .quiz-area h3 { font-size:17px; }
}
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>

<div id="app">
  <div class="header">
    <h1>🌟 宝宝启蒙学习</h1>
    <div class="actions">
      <button class="btn-icon" id="btnMute" title="声音开关">🔊</button>
      <button class="btn-back" id="btnHome" style="display:none;">⬅ 返回</button>
    </div>
  </div>

  <div class="content">
    <!-- HOME PAGE -->
    <div class="page active" id="page-home">
      <div class="home-cards">
        <div class="home-card math" onclick="app.navigate('math')" data-speak="数学启蒙">
          <span class="icon">🔢</span>
          <div class="title">数学启蒙</div>
          <div class="subtitle">认识数字 · 数数 · 加减法</div>
        </div>
        <div class="home-card english" onclick="app.navigate('english')" data-speak="英语启蒙">
          <span class="icon">🔤</span>
          <div class="title">英语启蒙</div>
          <div class="subtitle">字母 · 词汇 · 发音</div>
        </div>
        <div class="home-card" onclick="app.navigate('general')" data-speak="常识百科" style="background:linear-gradient(135deg,#E8FFEE,#FFF8E8);border:2px solid #B8E6C8;">
          <span class="icon">📚</span>
          <div class="title">常识百科</div>
          <div class="subtitle">安全 · 科学 · 生活</div>
        </div>
        <div class="home-card" onclick="app.navigate('story')" data-speak="故事书" style="background:linear-gradient(135deg,#FFF0F8,#F0E8FF);border:2px solid #D8C0F0;">
          <span class="icon">📖</span>
          <div class="title">故事书</div>
          <div class="subtitle">语音 · 漫画 · 电子书</div>
        </div>
      </div>
    </div>

    <!-- STORYBOOK PAGE -->
    <div class="page section" id="page-story">
      <div id="story-content"></div>
    </div>

    <!-- GENERAL KNOWLEDGE PAGE -->
    <div class="page section" id="page-general">
      <div class="sub-cards">
        <div class="sub-card" onclick="app.showGeneralTab('safety')" data-speak="安全教育"><span class="icon">🛡️</span><span class="label">安全教育</span></div>
        <div class="sub-card" onclick="app.showGeneralTab('science')" data-speak="科学常识"><span class="icon">🔬</span><span class="label">科学常识</span></div>
        <div class="sub-card" onclick="app.showGeneralTab('spotdiff')" data-speak="火眼金睛"><span class="icon">🔍</span><span class="label">火眼金睛</span></div>
        <div class="sub-card" onclick="app.showGeneralTab('drawing')" data-speak="创意画板"><span class="icon">🎨</span><span class="label">创意画板</span></div>
      </div>
      <div id="general-content"></div>
    </div>

    <!-- MATH PAGE -->
    <div class="page section" id="page-math">
      <div class="sub-cards">
        <div class="sub-card" onclick="app.showMathTab('numbers')" data-speak="认识数字"><span class="icon">1️⃣</span><span class="label">认识数字</span></div>
        <div class="sub-card" onclick="app.showMathTab('counting')" data-speak="数数练习"><span class="icon">🧮</span><span class="label">数数练习</span></div>
        <div class="sub-card" onclick="app.showMathTab('addition')" data-speak="加法入门"><span class="icon">➕</span><span class="label">加法入门</span></div>
        <div class="sub-card" onclick="app.showMathTab('subtraction')" data-speak="减法入门"><span class="icon">➖</span><span class="label">减法入门</span></div>
        <div class="sub-card" onclick="app.showMathTab('trace')" data-speak="写数字"><span class="icon">✏️</span><span class="label">写数字</span></div>
        <div class="sub-card" onclick="app.showMathTab('comparison')" data-speak="比较大小"><span class="icon">⚖️</span><span class="label">比较大小</span></div>
        <div class="sub-card" onclick="app.showMathTab('multiplication')" data-speak="乘法入门"><span class="icon">✖️</span><span class="label">乘法入门</span></div>
        <div class="sub-card" onclick="app.showMathTab('ordering')" data-speak="数字排序"><span class="icon">🔢</span><span class="label">数字排序</span></div>
        <div class="sub-card" onclick="app.showMathTab('patterns')" data-speak="找规律"><span class="icon">🔮</span><span class="label">找规律</span></div>
        <div class="sub-card" onclick="app.showMathTab('clock')" data-speak="认识钟表"><span class="icon">🕐</span><span class="label">认识钟表</span></div>
        <div class="sub-card" onclick="app.showMathTab('money')" data-speak="认识钱币"><span class="icon">💴</span><span class="label">认识钱币</span></div>
      </div>
      <div id="math-content"></div>
    </div>

    <!-- ENGLISH PAGE -->
    <div class="page section" id="page-english">
      <div class="sub-cards">
        <div class="sub-card" onclick="app.showEnglishTab('alphabet')" data-speak="字母学习"><span class="icon">🔤</span><span class="label">字母学习</span></div>
        <div class="sub-card" onclick="app.showEnglishTab('phonics')" data-speak="自然拼读"><span class="icon">🗣️</span><span class="label">自然拼读</span></div>
        <div class="sub-card" onclick="app.showEnglishTab('cvc')" data-speak="拼读练习"><span class="icon">🔡</span><span class="label">拼读练习</span></div>
        <div class="sub-card" onclick="app.showEnglishTab('animals')" data-speak="动物词汇"><span class="icon">🐱</span><span class="label">动物词汇</span></div>
        <div class="sub-card" onclick="app.showEnglishTab('colors')" data-speak="颜色词汇"><span class="icon">🎨</span><span class="label">颜色词汇</span></div>
        <div class="sub-card" onclick="app.showEnglishTab('fruits')" data-speak="水果词汇"><span class="icon">🍎</span><span class="label">水果词汇</span></div>

面。朱迪竖起长耳朵，听见了轻轻的呼吸声。她悄悄走近。", "kw": "躲藏"}, {"text": "朱迪猛地跳出来，用警绳套住了威索的手。小偷吓得胡萝卜掉在地上。朱迪说：“你跑不掉了！”", "kw": "抓住"}, {"text": "朱迪把胡萝卜还给了小兔子。小兔子开心地笑了。朱迪的警徽在阳光下闪闪发光。", "kw": "归还"}], "id": "judy_08", "icon": "🐰", "img_prefix": "img/judy/judy_08/", "audio_prefix": "audio/judy/judy_08/"}, {"title": "朱迪帮助老山羊", "pages": [{"text": "朱迪兔在动物城巡逻。她看见一只老山羊在路边叹气。", "kw": "巡逻"}, {"text": "老山羊的菜篮子翻了，胡萝卜滚了一地。他弯不下腰，很着急。", "kw": "菜篮子"}, {"text": "朱迪跑过去说：“爷爷别急，我来帮您！”她轻轻扶起老山羊。", "kw": "帮助"}, {"text": "朱迪把胡萝卜一个一个捡回篮子里。她还用树叶擦干净泥土。", "kw": "捡起"}, {"text": "老山羊笑了，摸摸朱迪的长耳朵：“谢谢你，好孩子。”", "kw": "谢谢"}, {"text": "朱迪挥手说再见，心里暖暖的。帮助别人真快乐！", "kw": "快乐"}], "id": "judy_09", "icon": "🐰", "img_prefix": "img/judy/judy_09/", "audio_prefix": "audio/judy/judy_09/"}, {"title": "朱迪的安全课", "pages": [{"text": "小兔子朱迪今天在幼儿园当安全小老师。她竖起长耳朵，笑眯眯地说：“我们来学安全知识吧！”", "kw": "safety lesson"}, {"text": "朱迪拿起一个红苹果。“陌生人给的食物，不能吃哦！”她摇摇头，把苹果轻轻推开。", "kw": "stranger food"}, {"text": "走廊上，小狐狸尼克想跑快。朱迪伸出手说：“慢慢走，不推挤，一个跟着一个才安全。”", "kw": "walk slowly"}, {"text": "午睡时，小羊把珠子往鼻子里塞。朱迪急忙说：“小东西不能放进嘴巴鼻子耳朵里，会卡住！”", "kw": "small objects"}, {"text": "上厕所时，朱迪提醒大家：“地面有水要小心，一步一步慢慢走，小手扶好小扶手。”", "kw": "wet floor"}, {"text": "放学了，朱迪说：“牵好爸爸妈妈的手，不乱跑，幼儿园安全课，每天都要记住哦！”", "kw": "hold hands"}], "id": "judy_10", "icon": "🐰", "img_prefix": "img/judy/judy_10/", "audio_prefix": "audio/judy/judy_10/"}, {"title": "朱迪的快递大冒险", "pages": [{"text": "兔子警官朱迪收到一个快递。她打开一看，盒子是空的！", "kw": "空盒子"}, {"text": "朱迪问：“我的胡萝卜笔呢？”她决定去找快递员闪电树懒。", "kw": "闪电"}, {"text": "闪电慢悠悠地说：“我……记得……放……进去……了……”", "kw": "慢悠悠"}, {"text": "朱迪沿着快递车痕迹找啊找。她在草丛里发现了一支笔。", "kw": "草丛"}, {"text": "原来是快递车颠了一下，笔掉出来啦！小老鼠正用它画画呢。", "kw": "小老鼠"}, {"text": "大家一起把笔放回盒子。朱迪笑着说：“谢谢你们帮忙！”", "kw": "一起笑"}], "id": "judy_11", "icon": "🐰", "img_prefix": "img/judy/judy_11/", "audio_prefix": "audio/judy/judy_11/"}, {"title": "冰淇淋车坏了", "pages": [{"text": "兔子警官朱迪在公园里巡逻。她看到冰淇淋车停着不动，小动物们都很伤心。", "kw": "Judy patrolling park, sad animals"}, {"text": "朱迪找来了好朋友尼克。他们决定一起想办法修好冰淇淋车。", "kw": "Judy and Nick together"}, {"text": "他们趴下一看，原来是车轮坏了。尼克拿出工具箱，朱迪也来帮忙。", "kw": "broken wheel, toolbox"}, {"text": "朱迪扶着轮子，尼克用扳手拧紧螺丝。咔嚓咔嚓，车轮修好啦！", "kw": "fixing wheel with wrench"}, {"text": "冰淇淋车又能开动了！小动物们排起了长长的队伍，等着买好吃的冰淇淋。", "kw": "ice cream truck working, queue"}, {"text": "朱迪和尼克也得到了冰淇淋。他们开心地舔着，这是最棒的一天。", "kw": "Judy and Nick eating ice cream, happy"}], "id": "judy_12", "icon": "🐰", "img_prefix": "img/judy/judy_12/", "audio_prefix": "audio/judy/judy_12/"}, {"title": "朱迪兔和坏掉的红绿灯", "pages": [{"text": "朱迪兔出门巡逻，看到十字路口的红绿灯不亮了。汽车和小动物们挤在一起，不知道该怎么走。", "kw": "红绿灯坏了"}, {"text": "朱迪赶紧站到路中间，举起小爪子指挥交通。她让左边的车先走，再让右边的车慢慢开。", "kw": "指挥交通"}, {"text": "小绵羊想过马路，朱迪温柔地拦住她。她说：“请等一等，现在不安全哦。”", "kw": "保护小绵羊"}, {"text": "朱迪打电话给猫头鹰修理工。猫头鹰先生很快飞来，检查红绿灯，发现电线松了。", "kw": "请来修理工"}, {"text": "猫头鹰先生修好了红绿灯，红灯亮起来，绿灯也亮起来。大家开心地拍手叫好。", "kw": "红绿灯修好"}, {"text": "朱迪兔继续巡逻，她很高兴能帮助大家。动物城又恢复了秩序，真美好！", "kw": "朱迪很开心"}], "id": "judy_13", "icon": "🐰", "img_prefix": "img/judy/judy_13/", "audio_prefix": "audio/judy/judy_13/"}, {"title": "朱迪和河马过马路", "pages": [{"text": "小兔子朱迪在动物城巡逻。她看见河马先生站在路边，看起来很着急。", "kw": "马路"}, {"text": "河马先生想过马路，可是车太多了。朱迪说：“我来帮你！”", "kw": "帮助"}, {"text": "朱迪指着斑马线说：“过马路要走这里。”河马先生点点头。", "kw": "斑马线"}, {"text": "红灯亮了，朱迪说：“红灯停，我们要等一等。”河马先生耐心等待。", "kw": "红灯"}, {"text": "绿灯亮了，朱迪拉起河马先生的手。他们一起慢慢走过马路。", "kw": "绿灯"}, {"text": "河马先生安全到了对面，开心地说：“谢谢你，朱迪！”朱迪笑着挥手再见。", "kw": "安全"}], "id": "judy_14", "icon": "🐰", "img_prefix": "img/judy/judy_14/", "audio_prefix": "audio/judy/judy_14/"}, {"title": "朱迪的马拉松比赛", "pages": [{"text": "朱迪宣布动物城要举办马拉松比赛。所有小动物都可以参加。", "kw": "Judy Hopps announcing a marathon, colorful Zootopia background, happy animals"}, {"text": "朱迪和尼克一起在公园里练习跑步。尼克说：“我也要参加比赛！”", "kw": "Judy Hopps and Nick Wilde jogging in park, sunny day, trees"}, {"text": "比赛当天，起跑线站满了动物。有乌龟、大象，还有小羊。", "kw": "Starting line of marathon, many animals gathering, turtle, elephant, sheep, city hall"}, {"text": "比赛开始啦！朱迪跑得飞快，尼克骑着自行车跟在旁边，为她加油。", "kw": "Judy running fast, Nick riding a bicycle next to her, cheering, race track"}, {"text": "朱迪有点累了，但朋友们都在喊：“加油，朱迪！”她又充满了力量。", "kw": "Judy looking tired, friends cheering, crowd with signs, Clawhauser and others"}, {"text": "朱迪冲过终点线，赢得了亮闪闪的奖牌。大家开心地抱在一起，友谊第一！", "kw": "Judy crossing finish line, winning medal, happy celebration, confetti, Nick hugging her"}], "id": "judy_15", "icon": "🐰", "img_prefix": "img/judy/judy_15/", "audio_prefix": "audio/judy/judy_15/"}, {"title": "闪电树懒开车啦", "pages": [{"text": "兔子警官朱迪正在巡逻，看见一辆小车开得比蜗牛还慢。她好奇地跑过去，想看看是谁在开车。", "kw": "朱迪"}, {"text": "原来是她的好朋友闪电树懒！闪电开心地举起爪子，慢慢地说：“嗨……朱……迪……”", "kw": "闪电"}, {"text": "绿灯亮了，闪电才慢慢踩下油门。后面的小汽车排起了长长的队伍，可是大家都不着急，还笑着和闪电打招呼。", "kw": "慢"}, {"text": "朱迪坐上闪电的车，想教他开快一点点。闪电微笑着，用很慢很慢的速度转动方向盘。", "kw": "教开车"}, {"text": "他们慢悠悠地经过公园，看到了小蝴蝶、小花，还有一只在晒太阳的小猫。朱迪觉得这样看风景真不错。", "kw": "风景"}, {"text": "最后，所有小动物都学会了耐心等待。闪电树懒虽然开得慢，但给大家带来了快乐和微笑。", "kw": "耐心"}], "id": "judy_16", "icon": "🐰", "img_prefix": "img/judy/judy_16/", "audio_prefix": "audio/judy/judy_16/"}, {"title": "朱迪帮助迷路的小犀牛", "pages": [{"text": "朱迪警官在动物城巡逻。她看到一只小犀牛在路边哭。", "kw": "巡逻"}, {"text": "小犀牛说：“我找不到妈妈了。”朱迪蹲下来，轻轻拍拍他。", "kw": "迷路"}, {"text": "朱迪问：“你记得妈妈在哪里吗？”小犀牛摇摇头，眼泪汪汪。", "kw": "安慰"}, {"text": "朱迪笑着说：“别怕，我带你去找妈妈。”她牵着小犀牛的手往前走。", "kw": "帮助"}, {"text": "他们走过大树，穿过小桥，听见远处传来熟悉的声音。犀牛妈妈跑过来，抱住小犀牛。", "kw": "寻找"}, {"text": "小犀牛开心地笑了，说：“谢谢朱迪！”朱迪挥挥手，继续去巡逻了。", "kw": "团聚"}], "id": "judy_17", "icon": "🐰", "img_prefix": "img/judy/judy_17/", "audio_prefix": "audio/judy/judy_17/"}, {"title": "朱迪在游乐园", "pages": [{"text": "兔子朱迪和爸爸妈妈去游乐园。她看到了大大的摩天轮，开心地跳跳跳。", "kw": "游乐园"}, {"text": "朱迪追着一只花蝴蝶跑呀跑。一回头，爸爸妈妈不见了！", "kw": "跑开"}, {"text": "朱迪心里咚咚跳，小声说：“我不哭，要勇敢。”她站在了原地。", "kw": "勇敢"}, {"text": "一只穿制服的河马阿姨走过来。“小朋友，需要帮忙吗？”朱迪点点头。", "kw": "河马阿姨"}, {"text": "朱迪说：“我找不到爸爸妈妈了。”河马阿姨牵起她的小爪子，带她去服务中心。", "kw": "服务中心"}, {"text": "广播里传来：“朱迪家长请到服务中心。”爸爸妈妈很快来了，抱住朱迪笑。“你真棒！”", "kw": "团聚"}], "id": "judy_18", "icon": "🐰", "img_prefix": "img/judy/judy_18/", "audio_prefix": "audio/judy/judy_18/"}, {"title": "朱迪和水獭建桥", "pages": [{"text": "兔子警官朱迪来到河边，看见水獭们很着急。原来小桥被水冲坏了，大家过不去。", "kw": "桥坏了"}, {"text": "朱迪说：“别担心，我们一起建新桥！”水獭们高兴地拍手，找来树枝和石头。", "kw": "建新桥"}, {"text": "大象搬来粗木头，河狸帮忙啃木头。朱迪和大家一起扛木头，嘿呦嘿呦真努力。", "kw": "一起努力"}, {"text": "朱迪把木头排整齐，水獭用泥巴把缝填好。新桥又平又稳，像一道小彩虹。", "kw": "修桥"}, {"text": "桥建好了！水獭们排着队，蹦蹦跳跳过桥去。朱迪站在桥上，心里甜滋滋的。", "kw": "桥建好了"}, {"text": "大家谢谢朱迪，她说：“朋友一起帮忙，什么困难都不怕！”小桥永远连着小河两岸。", "kw": "朋友帮忙"}], "id": "judy_19", "icon": "🐰", "img_prefix": "img/judy/judy_19/", "audio_prefix": "audio/judy/judy_19/"}, {"title": "朱迪帮助小考拉", "pages": [{"text": "朱迪兔警官在公园里巡逻。她看见一只小考拉在哭。小考拉找不到妈妈了。", "kw": "公园"}, {"text": "朱迪蹲下来，轻轻问：“你怎么了？”小考拉说：“我爬树玩，妈妈不见了。”", "kw": "哭"}, {"text": "朱迪拉着小考拉的手，一起找妈妈。她们看见长颈鹿阿姨，可是不是妈妈。", "kw": "找妈妈"}, {"text": "朱迪抱起小考拉，让他看高高的树。小考拉开心地喊：“妈妈在树上！”", "kw": "高高的树"}, {"text": "考拉妈妈从树上慢慢爬下来，抱住小考拉。她谢谢朱迪的帮助。", "kw": "爬下来"}, {"text": "朱迪笑着说：“下次要拉紧妈妈的手哦！”小考拉点点头，挥手说再见。", "kw": "再见"}], "id": "judy_20", "icon": "🐰", "img_prefix": "img/judy/judy_20/", "audio_prefix": "audio/judy/judy_20/"}, {"title": "汪汪队大火救援", "pages": [{"text": "汪汪队总部响起警报！莱德说：“城市里发生了大火，我们需要马上出发！”", "kw": "汪汪队 警报 大火"}, {"text": "勇敢的毛毛开着消防车，第一个冲向火场。他大声喊：“我来了，不要怕！”", "kw": "毛毛 消防车 火场"}, {"text": "阿奇用扩音器让大家保持安全距离。他说：“请退后，这里很危险！”", "kw": "阿奇 安全 危险"}, {"text": "毛毛举起巨大的消防水管，对着火焰喷出高高的水柱。火焰慢慢变小了。", "kw": "水管 喷水 火焰"}, {"text": "莱德在空中驾驶直升机观察，指挥伙伴们：“干得好，左边还有一点火苗！”", "kw": "莱德 直升机 指挥"}, {"text": "大火终于被扑灭，大家都安全了。市民们欢呼：“谢谢汪汪队，你们是最棒的！”", "kw": "扑灭 安全 欢呼"}], "id": "paw_01", "icon": "🐶", "img_prefix": "img/paw/paw_01/", "audio_prefix": "audio/paw/paw_01/"}, {"title": "小猫卡在树上啦！", "pages": [{"text": "冒险湾阳光明媚。一只小猫咪爬上了高高的大树。它下不来了，喵喵叫。", "kw": "阳光下的冒险湾，一棵高高的大树，小猫在树枝上喵喵叫。"}, {"text": "莱德接到求救电话。他立刻召集汪汪队。狗狗们跑到总部集合。", "kw": "莱德在总部接电话，狗狗们跑向总部，汪汪队集结。"}, {"text": "毛毛开车第一个到达。他架起云梯消防车，梯子伸向小猫。", "kw": "毛毛驾驶消防车赶到，云梯升向树上的小猫。"}, {"text": "小猫害怕得发抖，不敢往下跳。毛毛爬上梯子，轻声安慰它。", "kw": "毛毛爬上云梯，伸手安慰发抖的小猫。"}, {"text": "毛毛轻轻抱起小猫，慢慢爬下梯子。小猫安全地回到地面。", "kw": "毛毛抱着小猫从梯子下来，树下的大家开心鼓掌。"}, {"text": "莱德奖励汪汪队小狗饼干。小猫开心地蹭着毛毛的腿。汪汪队又成功了！", "kw": "莱德给汪汪队发饼干，小猫蹭毛毛的腿，大家快乐合影。"}], "id": "paw_02", "icon": "🐶", "img_prefix": "img/paw/paw_02/", "audio_prefix": "audio/paw/paw_02/"}, {"title": "汪汪队：洪水救援", "pages": [{"text": "冒险湾下起了大雨，河水涨得好高。汪汪队，我们要出发了！", "kw": "大雨"}, {"text": "莱德说：“小砾，用你的挖土机挡住水流！”小砾马上行动起来。", "kw": "小砾"}, {"text": "阿奇发现一只小猫咪被困在树上。他用云梯把小猫安全救下来。", "kw": "阿奇"}, {"text": "毛毛用水上摩托艇靠近一座被水围住的小房子。里面有个小宝宝在哭。", "kw": "毛毛"}, {"text": "天天驾驶直升机，找到一条安全的路线，引导大家往高处走。", "kw": "天天"}, {"text": "洪水退去，大家都安全了！冒险湾的居民们感谢汪汪队。汪汪队真棒！", "kw": "救援成功"}], "id": "paw_03", "icon": "🐶", "img_prefix": "img/paw/paw_03/", "audio_prefix": "audio/paw/paw_03/"}, {"title": "汪汪队立大功：雪崩大救援", "pages": [{"text": "冬天到了，冒险湾的山上盖满了厚厚的白雪。莱德和汪汪队正在雪地里开心地玩耍。", "kw": "雪山玩耍"}, {"text": "突然，山上传来轰隆隆的声音，雪崩来了！一只小兔子被困在了雪堆里，害怕得直发抖。", "kw": "雪崩发生"}, {"text": "莱德立刻召集汪汪队，说：“绿色代表出发！阿奇驾驶警车，毛毛开灭火器，我们要去救小兔子！”", "kw": "紧急集合"}, {"text": "汪汪队飞快赶到雪山。阿奇用铲子小心地挖雪，毛毛用温暖的毛毯包住小兔子，小兔子不再发抖了。", "kw": "挖雪救援"}, {"text": "雪崩堵住了山路，大家回不去了。小砾开着推土机，把雪堆推到一边，清理出一条安全的小路。", "kw": "清理道路"}, {"text": "小兔子终于回到了妈妈身边，开心地跳来跳去。莱德说：“没有困难的工作，只有勇敢的狗狗！”", "kw": "成功救援"}], "id": "paw_04", "icon": "🐶", "img_prefix": "img/paw/paw_04/", "audio_prefix": "audio/paw/paw_04/"}, {"title": "汪汪队立大功：火车脱轨大救援", "pages": [{"text": "小火车咔嚓咔嚓开过来，车上装着好多生日气球。突然，铁轨旁的山石轰隆隆滚下来！", "kw": "火车运气球"}, {"text": "石头挡住铁轨，火车头一歪，“哐当”一声脱轨了。司机叔叔急得直冒汗，大声呼叫：“汪汪队，我们需要帮助！”", "kw": "火车脱轨"}, {"text": "莱德收到信号，立刻吹响汪汪哨。阿奇、毛毛、天天和小砾飞快跑到总部集合。", "kw": "汪汪队集合"}, {"text": "莱德说：“阿奇，你用绞盘拉开石头。毛毛，你喷水冷却火车头。天天，你从空中查看情况。”", "kw": "分配任务"}, {"text": "阿奇拉动绞盘，大石头滚开啦。毛毛用水枪喷水，火车头不再冒烟。天天在空中指挥方向。", "kw": "齐心救援"}, {"text": "大家合力把火车推回铁轨上，司机叔叔开心地笑了：“谢谢汪汪队！”气球又飘起来，火车继续欢快地跑起来。", "kw": "任务完成"}], "id": "paw_05", "icon": "🐶", "img_prefix": "img/paw/paw_05/", "audio_prefix": "audio/paw/paw_05/"}, {"title": "游轮漏水大救援", "pages": [{"text": "冒险湾的游轮上，突然破了一个洞，海水涌进来。船长急忙呼叫汪汪队，莱德马上集合狗狗们。", "kw": "游轮甲板破洞，海水流入，船长挥手求救"}, {"text": "莱德说：“别担心，汪汪队要出动了！”阿奇开着警车，毛毛开着消防车，天天驾驶直升机，飞速赶往码头。", "kw": "莱德指挥，阿奇、毛毛、天天分别驾驶车辆出发"}, {"text": "天天在空中发现游轮的位置，用对讲机告诉伙伴们。毛毛跳上船，用他的水炮管堵住小洞，但水还在漏。", "kw": "天天在直升机上指点，毛毛用水炮管堵洞"}, {"text": "阿奇用绞盘将救生圈抛给受惊的乘客，安抚他们。莱德说：“我们需要更大的塞子！”", "kw": "阿奇用绞盘抛救生圈，乘客穿救生衣"}, {"text": "聪明的莱德想到了办法，他让天天吊来一块大橡胶垫。阿奇和毛毛一起把垫子压在破洞上，水终于止住了！", "kw": "天天吊着橡胶垫，阿奇和毛毛合力压住破洞"}, {"text": "游轮安全了，所有人都欢呼起来。船长感谢汪汪队，狗狗们说：“没有困难的工作，只有勇敢的狗狗！”", "kw": "游轮恢复平静，狗狗们和船长合影，夕阳下庆祝"}], "id": "paw_06", "icon": "🐶", "img_prefix": "img/paw/paw_06/", "audio_prefix": "audio/paw/paw_06/"}, {"title": "飞机迫降大救援", "pages": [{"text": "一架观光小飞机在冒险湾上空快乐地飞行。突然，引擎发出噗噗的怪声，飞机开始摇晃起来。飞行员着急地呼叫救援。", "kw": "蓝色小飞机, 摇晃的翅膀, 蓝天白云, 飞行员紧张"}, {"text": "天天正在空中巡逻，发现了故障飞机。她立刻飞回总部告诉莱德：“有飞机需要紧急迫降！”", "kw": "天天驾驶直升机, 莱德在总部, 屏幕显示警报"}, {"text": "莱德召集汪汪队：“我们需要清理跑道，准备救援！”小砾开着推土机去清理碎石，阿奇用警车指挥大家远离跑道。", "kw": "小砾推土机, 阿奇警车闪灯, 清理跑道, 狗狗们集合"}, {"text": "飞机开始下降，天天在它旁边勇敢地引导：“别怕，跟着我，慢慢对准跑道！”毛毛也准备好了急救箱在跑道旁等待。", "kw": "天天伴飞, 飞机对准跑道, 毛毛拿着急救箱"}, {"text": "飞机安全着陆，颠簸了几下后稳稳停住。飞行员走下飞机，紧紧拥抱天天：“谢谢汪汪队，你们是最棒的！”", "kw": "飞机着陆摩擦火花, 飞行员拥抱天天, 狗狗们欢呼"}, {"text": "莱德开心地说：“没有困难的工作，只有勇敢的狗狗！”冒险湾恢复了平静，汪汪队又立了一功。", "kw": "莱德抚摸天天, 汪汪队合影, 夕阳下冒险湾平静"}], "id": "paw_07", "icon": "🐶", "img_prefix": "img/paw/paw_07/", "audio_prefix": "audio/paw/paw_07/"}, {"title": "大桥救援记", "pages": [{"text": "冒险湾的大桥轰隆一声塌了！车辆和行人都过不去。莱德立刻召集汪汪队。", "kw": "大桥坍塌"}, {"text": "阿奇用绞盘拉起落水的木头。毛毛升起云梯，把被困的小猫救下来。", "kw": "紧急救援"}, {"text": "小砾开着挖土机，清理大石块。灰灰用回收工具，把碎木板变成临时桥板。", "kw": "清理重建"}, {"text": "路马启动气垫船，在河面搭建浮桥。大家喊：“加油，汪汪队！”", "kw": "搭建浮桥"}, {"text": "新桥暂时修好啦！人们小心地通过，笑着挥手说谢谢。狗狗们自豪地摇尾巴。", "kw": "临时通行"}, {"text": "莱德说：“没有困难的工作，只有勇敢的狗狗！”冒险湾又恢复了欢笑。", "kw": "勇敢狗狗"}], "id": "paw_08", "icon": "🐶", "img_prefix": "img/paw/paw_08/", "audio_prefix": "audio/paw/paw_08/"}, {"title": "汪汪队立大功：地震大救援", "pages": [{"text": "冒险湾突然晃动起来，地震了！莱德赶紧召集汪汪队。", "kw": "地震"}, {"text": "毛毛用云梯救出被困高楼的小猫。它说：“别怕，我来啦！”", "kw": "云梯"}, {"text": "小砾的挖掘机移开倒塌的石头，找到被压住的小鸟。", "kw": "挖掘机"}, {"text": "天天开着直升机从空中搜寻，发现山边有受困的兔子。", "kw": "直升机"}, {"text": "阿奇用警车开路，引导大家安全到达空地。", "kw": "空地"}, {"text": "汪汪队又一次救了大家！莱德说：“真是团结的好伙伴！”", "kw": "团结"}], "id": "paw_09", "icon": "🐶", "img_prefix": "img/paw/paw_09/", "audio_prefix": "audio/paw/paw_09/"}, {"title": "汪汪队立大功：海啸预警", "pages": [{"text": "今天，汪汪队在海滩上开心地玩耍。突然，莱德的平板电脑发出了“滴滴滴”的警报声。", "kw": "警报"}, {"text": "莱德赶紧集合大家，说：“海啸要来了，我们必须立刻行动！”他派汪汪队去帮助所有人安全撤离。", "kw": "撤离"}, {"text": "阿奇用警车拦住了海滩入口，提醒大家别再靠近。毛毛开着消防车，载着游客快快离开。", "kw": "警戒"}, {"text": "小砾用推土机堆起高高的沙墙，想挡住海浪。天天驾驶直升机在空中巡逻，寻找还没走的人。", "kw": "沙墙"}, {"text": "巨大的海浪冲了过来，但海滩上已经没有人了。大家都安全地站在小山上，汪汪队也及时撤到了高处。", "kw": "安全"}, {"text": "海啸过后，大家都很感谢汪汪队。莱德笑着说：“你们做得真棒！记住，听到警报就要立刻往高处跑。”", "kw": "感谢"}], "id": "paw_10", "icon": "🐶", "img_prefix": "img/paw/paw_10/", "audio_prefix": "audio/paw/paw_10/"}, {"title": "汪汪队立大功：火山爆发", "pages": [{"text": "冒险湾的火山突然轰隆隆响，冒出浓浓的灰烟。莱德接到警报，立刻召唤汪汪队集合。", "kw": "volcano"}, {"text": "“火山要爆发了，我们得赶紧让动物们安全撤离！”莱德说。毛毛驾驶直升机，阿奇用扩音器通知大家。", "kw": "warning"}, {"text": "小砾开着推土机，在火山脚挖出一条安全通道。灰灰用回收爪搬开挡路的石头，帮助小兔子们通过。", "kw": "evacuation"}, {"text": "火山喷出滚烫的岩浆，往森林流去。天天从空中洒水降温，路马驾驶气垫船挡住岩浆流。", "kw": "lava"}, {"text": "汪汪队齐心协力，把岩浆引到了大海边。大家成功保护了冒险湾，动物们都安全了。", "kw": "teamwork"}, {"text": "火山终于安静下来，汪汪队累得坐在地上。莱德夸奖大家：“只要团结合作，再大的困难也不怕！”", "kw": "safe"}], "id": "paw_11", "icon": "🐶", "img_prefix": "img/paw/paw_11/", "audio_prefix": "audio/paw/paw_11/"}, {"title": "汪汪队立大功：龙卷风来啦", "pages": [{"text": "天空突然变黑了，大风呼呼地吹。树叶和帽子都被吹上了天。", "kw": "乌云，大风，树叶飞"}, {"text": "莱德拿出平板一看，龙卷风马上要来了。他大声喊：“汪汪队，总部集合！”", "kw": "莱德，平板，警报"}, {"text": "狗狗们飞快地滑下滑梯，坐上自己的车。莱德说：“大家要帮助朋友们躲进安全屋。”", "kw": "滑梯，狗狗，等待指令"}, {"text": "毛毛拉响警笛，提醒大家快进屋。路马开着气垫船，把岸边的鸭子带上船。", "kw": "毛毛，消防车，路马，鸭子"}, {"text": "小砾用推土机推开倒下的大树。灰灰修好了被风吹坏的屋顶。", "kw": "小砾，推土机，灰灰，修屋顶"}, {"text": "龙卷风走了，太阳出来了。大家都安全了，笑着说：“谢谢汪汪队！”", "kw": "晴天，安全，大家笑"}], "id": "paw_12", "icon": "🐶", "img_prefix": "img/paw/paw_12/", "audio_prefix": "audio/paw/paw_12/"}, {"title": "蜜蜂大迁移", "pages": [{"text": "莱德和汪汪队正在瞭望台玩耍。突然，电话铃响了，是农夫由美打来的。她说：“蜜蜂们要搬家，需要帮助！”", "kw": "蜜蜂搬家 求助"}, {"text": "莱德立刻召集汪汪队。他说：“阿奇，我们需要你的梯子；灰灰，带上你的网兜。”大家迅速出发，赶往农场。", "kw": "汪汪队出发 工具"}, {"text": "在农场，蜜蜂们嗡嗡嗡地飞着，找不到新家。阿奇架起梯子，灰灰轻轻用网兜引导蜜蜂飞向新蜂箱。", "kw": "引导蜜蜂 新蜂箱"}, {"text": "突然，一阵大风吹来，把蜂箱盖子吹跑了。小蜜蜂们害怕极了，到处乱飞。毛毛拿出他的水枪，小心地喷水挡风。", "kw": "大风 毛毛帮忙"}, {"text": "天天用她的直升机从空中撒下花瓣，吸引蜜蜂。蜜蜂们闻到花香，慢慢聚拢过来，飞进了新蜂箱。", "kw": "天天撒花瓣 聚拢"}, {"text": "蜜蜂们在新家开心地跳起舞。农夫由美说：“谢谢汪汪队！你们是最棒的。”莱德说：“只要齐心协力，没有办不到的事！”", "kw": "蜜蜂安家 感谢"}], "id": "paw_13", "icon": "🐶", "img_prefix": "img/paw/paw_13/", "audio_prefix": "audio/paw/paw_13/"}, {"title": "停电大救援", "pages": [{"text": "冒险湾突然停电了，到处黑乎乎的。", "kw": "停电"}, {"text": "莱德接到电话，谷仓里的小动物需要保暖。", "kw": "求助"}, {"text": "阿奇用他的警车灯照亮道路，毛毛开着消防车来帮忙。", "kw": "照明"}, {"text": "小砾挖掘机挖开地面，发现断裂的电线。", "kw": "抢修"}, {"text": "天天空降下新的电缆，路马在水边保证安全。", "kw": "合作"}, {"text": "电修好了，灯光亮起，大家欢呼起来。", "kw": "恢复"}], "id": "paw_14", "icon": "🐶", "img_prefix": "img/paw/paw_14/", "audio_prefix": "audio/paw/paw_14/"}, {"title": "汪汪队：隧道大救援", "pages": [{"text": "汪汪队正在基地玩耍。突然，电话响了！莱德接到紧急通知：山上的隧道塌方了，小兔子被困在里面。", "kw": "汪汪队 隧道塌方 小兔子"}, {"text": "莱德立刻召集汪汪队：“毛毛，我们需要你的挖掘机挖开落石！小砾，你的推土机来清理碎石！”", "kw": "莱德 毛毛 小砾 挖掘机 推土机"}, {"text": "毛毛开着挖掘机，小心地挖开大石头。小砾用推土机把碎石推到一边。他们一起努力，很快看到了隧道口。", "kw": "挖掘 推土 碎石 隧道口"}, {"text": "天天驾驶直升机在空中观察：“莱德，我看到小兔子了！它躲在角落里，没有受伤，只是有点害怕。”", "kw": "天天 直升机 观察 小兔子"}, {"text": "阿奇钻进隧道，温柔地抱起小兔子：“别怕，小兔子，我们带你出去。”他慢慢爬出隧道，把兔子交给莱德。", "kw": "阿奇 钻进 抱起 带出"}, {"text": "小兔子安全了，开心地跳起来。莱德夸奖汪汪队：“你们又完成了一次完美的救援！没有困难的工作，只有勇敢的狗狗！”", "kw": "安全 夸奖 救援 勇敢狗狗"}], "id": "paw_15", "icon": "🐶", "img_prefix": "img/paw/paw_15/", "audio_prefix": "audio/paw/paw_15/"}, {"title": "汪汪队破冰救援", "pages": [{"text": "冬天到了，冒险湾的湖面结冰了。小朋友们开心地在冰上滑来滑去。", "kw": "滑冰的孩子"}, {"text": "突然，咔嚓一声，冰面裂开了！小莉掉进了冰冷的湖水里，害怕地哭喊。", "kw": "冰面破裂"}, {"text": "莱德接到求救电话，立刻召唤汪汪队：“阿奇、毛毛，出发救援！”汪汪队跳上车子，火速赶往湖边。", "kw": "莱德召唤"}, {"text": "阿奇用安全绳拉住小莉，毛毛披上保暖毯靠近。大家小心地趴在冰面上，慢慢把小莉拉上来。", "kw": "冰上救援"}, {"text": "小莉被救上岸，浑身发抖。毛毛用热风轻轻吹干她，阿奇递上热巧克力。小莉终于不哭了。", "kw": "温暖照顾"}, {"text": "莱德提醒大家：“春天冰面变薄，千万不能上冰玩哦！”小朋友们点头，和汪汪队一起安全回家。", "kw": "安全回家"}], "id": "paw_16", "icon": "🐶", "img_prefix": "img/paw/paw_16/", "audio_prefix": "audio/paw/paw_16/"}, {"title": "毒蛇入侵大冒险", "pages": [{"text": "阳光明媚的早晨，冒险湾突然出现了一条小毒蛇。汪汪队接到警报，立刻集合出发！", "kw": "毒蛇出现"}, {"text": "毛毛用热成像扫描，发现小蛇躲在大石头后面。阿奇提醒大家：“小心，不要惊吓它。”", "kw": "发现蛇踪"}, {"text": "小砾用挖掘机铲斗轻轻围住小蛇，防止它乱跑。天天从空中观察，确保大家安全。", "kw": "安全围堵"}, {"text": "灰灰想起蛇怕噪音，拿来一个温柔的小铃铛，轻轻晃动引导小蛇离开。", "kw": "巧妙引导"}, {"text": "小蛇跟着铃铛声慢慢爬进特制的运输箱里。路马把箱子搬上船，准备送回远处的森林。", "kw": "安全转移"}, {"text": "回到森林，小蛇愉快地游走了。莱德夸奖大家：“真棒！我们用智慧保护了大家和小蛇。”", "kw": "快乐结局"}], "id": "paw_17", "icon": "🐶", "img_prefix": "img/paw/paw_17/", "audio_prefix": "audio/paw/paw_17/"}, {"title": "烟花事故", "pages": [{"text": "冒险湾的夜晚，烟花表演要开始了。大家都仰着头，等着看美丽的光。", "kw": "烟花表演"}, {"text": "突然，一颗烟花弹飞错了方向，点燃了旁边的彩旗。小火苗蹿了起来。", "kw": "起火"}, {"text": "莱德马上按下平板，呼叫汪汪队。毛毛，天天，阿奇，快集合！", "kw": "莱德呼叫"}, {"text": "毛毛开着消防车赶到，喷水灭火。狗狗们保护大家，远远地站好。", "kw": "毛毛灭火"}, {"text": "火很快被扑灭了，没有一个人受伤。大家都松了一口气，拍拍手。", "kw": "扑灭"}, {"text": "莱德拿出安全的小烟花，大家一起玩。今晚的冒险湾，还是那么快乐。", "kw": "安全烟花"}], "id": "paw_18", "icon": "🐶", "img_prefix": "img/paw/paw_18/", "audio_prefix": "audio/paw/paw_18/"}, {"title": "赛车大救援", "pages": [{"text": "冒险湾正在举行赛车比赛，小砾的赛车突然失控了！", "kw": "赛车比赛"}, {"text": "赛车冲向旋转木马，毛毛用消防车挡住去路。", "kw": "毛毛救援"}, {"text": "赛车又滑向冰淇淋摊，阿奇飞快地拉起了警戒线。", "kw": "阿奇警戒"}, {"text": "天天驾驶直升机放下救生绳，套住了赛车尾部。", "kw": "天天直升机"}, {"text": "莱德指挥大家合力拉紧绳子，赛车终于慢慢减速。", "kw": "团队合作"}, {"text": "赛车安全停下，小砾开心地说：“谢谢汪汪队！”", "kw": "救援成功"}], "id": "paw_19", "icon": "🐶", "img_prefix": "img/paw/paw_19/", "audio_prefix": "audio/paw/paw_19/"}, {"title": "外星来客", "pages": [{"text": "一天晚上，冒险湾的天空中闪过一道亮光。一架小小的飞碟降落在瞭望塔附近。", "kw": "飞碟降落"}, {"text": "莱德带着汪汪队赶来，发现了一位可爱的外星小朋友。他全身闪闪发光，看起来有点害怕。", "kw": "外星小朋友"}, {"text": "毛毛轻轻走上前，用鼻子碰了碰他。外星小朋友开心地笑了，发出叮咚的声音。", "kw": "毛毛安慰"}, {"text": "外星小朋友指着远处的星星，想要回家。莱德马上呼叫天天，启动直升机帮忙。", "kw": "想要回家"}, {"text": "天天用直升机吊起飞碟，飞向高高的夜空。外星小朋友向汪汪队挥手告别。", "kw": "送别飞碟"}, {"text": "飞碟消失在了星星里，汪汪队仰头望着天空。这真是最奇妙的一次救援！", "kw": "难忘的救援"}], "id": "paw_20", "icon": "🐶", "img_prefix": "img/paw/paw_20/", "audio_prefix": "audio/paw/paw_20/"}, {"title": "佩奇第一天上幼儿园", "pages": [{"text": "今天是佩奇第一天上幼儿园。她背着小书包，有点紧张。妈妈拉着她的手说：“别担心，会很好玩的。”", "kw": "幼儿园"}, {"text": "教室里，羚羊老师笑眯眯地迎接佩奇。“欢迎你，佩奇！”她带佩奇认识其他小朋友。", "kw": "老师"}, {"text": "小羊苏西跑过来，拉着佩奇的手。“我们一起玩积木吧！”佩奇开心地笑了。", "kw": "朋友"}, {"text": "大家围坐一圈，羚羊老师弹起吉他。佩奇跟着唱起歌，还拍起了小手。", "kw": "唱歌"}, {"text": "午餐时间到了，佩奇和小伙伴们一起吃面包和苹果。她学会了自己收拾餐盘。", "kw": "午餐"}, {"text": "放学时，妈妈来接佩奇。佩奇扑进妈妈怀里：“幼儿园真好玩，明天我还要来！”", "kw": "放学"}], "id": "peppa_01", "icon": "🐷", "img_prefix": "img/peppa/peppa_01/", "audio_prefix": "audio/peppa/peppa_01/"}, {"title": "佩奇的音乐派对", "pages": [{"text": "佩奇和乔治在客厅里，猪妈妈打开了音乐。大家都开心地拍手。", "kw": "音乐"}, {"text": "佩奇跳起舞来，她转圈圈，像一只小蝴蝶。乔治也跟着跳，跳得高高的。", "kw": "跳舞"}, {"text": "猪爸爸拿起吉他，弹出好听的曲子。佩奇唱起歌来，啦啦啦，真好听。", "kw": "唱歌"}, {"text": "小羊苏西来了，她敲起了小鼓。咚咚咚，大家一起合奏。", "kw": "合奏"}, {"text": "佩奇教乔治跳扭扭舞，扭扭屁股，摇摇手。乔治笑得咯咯咯。", "kw": "扭扭舞"}, {"text": "天黑了，音乐派对结束了。佩奇说：“唱歌跳舞真开心，下次再一起玩！”", "kw": "开心"}], "id": "peppa_03", "icon": "🐷", "img_prefix": "img/peppa/peppa_03/", "audio_prefix": "audio/peppa/peppa_03/"}, {"title": "画画比赛", "pages": [{"text": "佩奇和朋友们在草地上画画。老师说：“今天我们来比赛，画最喜欢的东西。”", "kw": "比赛"}, {"text": "佩奇画了一朵大大的太阳花。苏西画了一只可爱的蝴蝶。", "kw": "太阳花"}, {"text": "乔治画了一辆小恐龙车。丹尼画了一架飞机。", "kw": "恐龙车"}, {"text": "小兔瑞贝卡画了一篮子胡萝卜。大家都画得很认真。", "kw": "胡萝卜"}, {"text": "老师把画贴在墙上。每一幅画都很好看。", "kw": "画展"}, {"text": "老师笑着说：“每个人都是小画家！”大家开心地拍手。", "kw": "小画家"}], "id": "peppa_04", "icon": "🐷", "img_prefix": "img/peppa/peppa_04/", "audio_prefix": "audio/peppa/peppa_04/"}, {"title": "佩奇玩传球游戏", "pages": [{"text": "佩奇和乔治在花园里。他们想玩传球游戏。", "kw": "传球游戏"}, {"text": "妈妈猪把球传给佩奇。佩奇跳起来接住球，真开心！", "kw": "接球"}, {"text": "佩奇把球传给乔治。乔治用鼻子顶球，球飞起来了。", "kw": "鼻子顶球"}, {"text": "爸爸猪也来玩。他传给佩奇，佩奇传给妈妈。大家笑哈哈。", "kw": "全家一起玩"}, {"text": "球不小心滚进了泥坑。佩奇说：“没关系，我们一起踩泥坑吧！”", "kw": "泥坑"}, {"text": "大家把球拿出来，洗干净。然后继续传球，直到太阳下山。", "kw": "继续传球"}], "id": "peppa_05", "icon": "🐷", "img_prefix": "img/peppa/peppa_05/", "audio_prefix": "audio/peppa/peppa_05/"}, {"title": "午餐时间", "pages": [{"text": "叮叮叮！午餐时间到了。佩奇和乔治好饿呀！", "kw": "午餐时间"}, {"text": "猪妈妈端来了美味的意大利面。佩奇开心地拍手。", "kw": "意大利面"}, {"text": "乔治用叉子卷起面条，呼噜呼噜吃得香。", "kw": "叉子"}, {"text": "佩奇说：“乔治，要慢慢吃哦！”乔治点点头。", "kw": "慢慢吃"}, {"text": "吃完午餐，佩奇和乔治吃水果。甜甜的苹果真好吃！", "kw": "水果"}, {"text": "午餐结束了，大家一起收拾桌子。真是快乐的一餐！", "kw": "收拾"}], "id": "peppa_06", "icon": "🐷", "img_prefix": "img/peppa/peppa_06/", "audio_prefix": "audio/peppa/peppa_06/"}, {"title": "小医生游戏", "pages": [{"text": "佩奇和乔治在玩小医生游戏。佩奇当医生，乔治当病人。", "kw": "医生游戏"}, {"text": "佩奇戴上玩具听诊器，听听乔治的胸口。她说：“你有点咳嗽。”", "kw": "听诊器"}, {"text": "乔治张开嘴巴，佩奇用小电筒照一照。“啊——喉咙有点红。”", "kw": "喉咙"}, {"text": "佩奇拿出玩具体温计，给乔治量一量。“体温正常，不用担心。”", "kw": "体温计"}, {"text": "妈妈猪进来问：“小医生，我能看病吗？”佩奇高兴地说：“当然可以！”", "kw": "妈妈猪"}, {"text": "佩奇给妈妈猪贴上可爱的创可贴。大家一起开心地笑了。", "kw": "创可贴"}], "id": "peppa_07", "icon": "🐷", "img_prefix": "img/peppa/peppa_07/", "audio_prefix": "audio/peppa/peppa_07/"}, {"title": "佩奇搭积木房子", "pages": [{"text": "佩奇和乔治在玩积木。他们想搭一个高高的房子。", "kw": "积木、房子"}, {"text": "佩奇把积木一块一块叠起来。乔治也来帮忙。", "kw": "叠起来、帮忙"}, {"text": "哎呀，房子倒了！积木撒了一地。", "kw": "倒了、撒了一地"}, {"text": "佩奇说：“没关系，我们再试一次。”他们把积木捡起来。", "kw": "没关系、再试一次"}, {"text": "这次他们搭得稳稳的。房子越搭越高，真漂亮！", "kw": "稳稳的、越搭越高"}, {"text": "房子搭好了！佩奇和乔治开心地拍手。妈妈猪也夸他们真棒。", "kw": "搭好了、拍手、真棒"}], "id": "peppa_08", "icon": "🐷", "img_prefix": "img/peppa/peppa_08/", "audio_prefix": "audio/peppa/peppa_08/"}, {"title": "户外滑滑梯", "pages": [{"text": "今天阳光真好，佩奇和乔治去公园玩。公园里有一个又高又大的滑滑梯。", "kw": "公园"}, {"text": "佩奇兴奋地爬上楼梯，她说：“我要滑下来啦！”乔治在下面开心地拍手。", "kw": "滑滑梯"}, {"text": "小羊苏西也来了，大家一起排队滑滑梯。一个接一个，真有趣！", "kw": "排队"}, {"text": "佩奇从滑梯上滑下来，风在耳边呼呼响。她笑得合不拢嘴。", "kw": "滑下来"}, {"text": "轮到乔治了，他有点害怕。佩奇张开手臂说：“别怕，乔治，我在下面等你！”", "kw": "勇敢"}, {"text": "乔治鼓起勇气滑下来，大家都为他鼓掌。滑滑梯真好玩，他们玩得满头大汗。", "kw": "好玩"}], "id": "peppa_09", "icon": "🐷", "img_prefix": "img/peppa/peppa_09/", "audio_prefix": "audio/peppa/peppa_09/"}, {"title": "讲故事时间", "pages": [{"text": "佩奇和乔治坐在地毯上，等着爸爸讲故事。爸爸拿来一本大大的故事书。", "kw": "故事书"}, {"text": "爸爸翻开书，清清嗓子说：“从前，有一只勇敢的小恐龙。”乔治高兴地拍手。", "kw": "小恐龙"}, {"text": "小恐龙走啊走，遇到了会说话的大树。大树说：“你要去哪里呀？”", "kw": "会说话的大树"}, {"text": "爸爸用粗粗的声音模仿大树，佩奇和乔治咯咯笑。猪妈妈也坐过来一起听。", "kw": "模仿声音"}, {"text": "故事里，小恐龙帮助了小鸟，大家都为它鼓掌。佩奇说：“我也要帮助朋友！”", "kw": "帮助朋友"}, {"text": "故事讲完了，爸爸合上书。佩奇和乔治给了爸爸一个大大的拥抱，说：“再讲一个吧！”", "kw": "大大的拥抱"}], "id": "peppa_10", "icon": "🐷", "img_prefix": "img/peppa/peppa_10/", "audio_prefix": "audio/peppa/peppa_10/"}, {"title": "佩奇做手工", "pages": [{"text": "佩奇和乔治想一起做手工。他们找来了彩纸和胶水。", "kw": "彩纸"}, {"text": "妈妈说：“我们来剪小星星吧。”佩奇小心地拿起剪刀。", "kw": "剪刀"}, {"text": "乔治剪不好，有点着急。佩奇说：“别急，我来帮你。”", "kw": "帮助"}, {"text": "他们把小星星贴在蓝色卡纸上，像夜晚的天空。", "kw": "贴"}, {"text": "爸爸拿来亮片和毛线，说：“还可以再装饰一下。”", "kw": "装饰"}, {"text": "手工完成啦！一幅闪闪发光的星星画，大家都好开心。", "kw": "开心"}], "id": "peppa_11", "icon": "🐷", "img_prefix": "img/peppa/peppa_11/", "audio_prefix": "audio/peppa/peppa_11/"}, {"title": "佩奇学数数", "pages": [{"text": "佩奇和乔治在花园里玩。他们看到好多花朵。", "kw": "花朵"}, {"text": "妈妈猪问：“这里有几朵花呢？”佩奇开始数：“一、二、三。”", "kw": "数花"}, {"text": "乔治也来数：“一、二、三、四、五！”大家都鼓掌。", "kw": "乔治数数"}, {"text": "爸爸猪拿出水果。“我们来数水果吧！”佩奇数苹果：“一、二、三、四。”", "kw": "数苹果"}, {"text": "乔治数香蕉：“一、二。”佩奇帮他：“三、四、五！”乔治开心地笑。", "kw": "数香蕉"}, {"text": "大家一起数：“一、二、三、四、五！”佩奇学会了数数，真开心。", "kw": "学会数数"}], "id": "peppa_12", "icon": "🐷", "img_prefix": "img/peppa/peppa_12/", "audio_prefix": "audio/peppa/peppa_12/"}, {"title": "佩奇的角色扮演游戏", "pages": [{"text": "佩奇和乔治在房间里，想玩一个新游戏。佩奇说：“我们来玩角色扮演吧！我可以当医生。”", "kw": "医生"}, {"text": "乔治找来玩具听诊器，佩奇戴上白帽子。她温柔地说：“乔治病人，请张开嘴，让我看看你的喉咙。”", "kw": "听诊器"}, {"text": "这时，妈妈猪走进来，好奇地问：“小医生，我能看病吗？”佩奇高兴地点点头，让妈妈坐在小椅子上。", "kw": "妈妈猪"}, {"text": "妈妈猪假装咳嗽，佩奇认真听她的心跳。然后说：“你需要多喝温水，好好休息，就会好起来。”", "kw": "心跳"}, {"text": "爸爸猪也来了，他假装摔倒了。乔治立刻跑去拿绷带，佩奇哈哈笑：“别担心，乔治护士会帮你包扎！”", "kw": "绷带"}, {"text": "最后，全家一起玩老师游戏。佩奇当老师，教大家唱字母歌，房间里充满了欢笑声。", "kw": "老师"}], "id": "peppa_13", "icon": "🐷", "img_prefix": "img/peppa/peppa_13/", "audio_prefix": "audio/peppa/peppa_13/"}, {"title": "音乐课", "pages": [{"text": "今天，佩奇和乔治去幼儿园上音乐课。羚羊老师拿出小鼓和摇铃，大家都很开心。", "kw": "音乐课"}, {"text": "羚羊老师教大家拍拍手，跟着节奏走。佩奇拍得很认真，乔治也扭起了小屁股。", "kw": "节奏"}, {"text": "佩奇拿起小鼓咚咚敲，乔治摇着铃铛叮叮响。大家一起合奏，声音真好听。", "kw": "乐器"}, {"text": "羚羊老师弹起吉他，大家跟着唱起歌。佩奇唱得很大声，小羊苏西也唱得笑眯眯。", "kw": "唱歌"}, {"text": "佩奇和朋友们排成一排，一边跳舞一边敲乐器。乔治变成小指挥，小手挥来挥去。", "kw": "跳舞"}, {"text": "音乐课结束了，大家都说真好玩。佩奇和乔治回家，还哼着刚学的歌给妈妈听。", "kw": "回家"}], "id": "peppa_14", "icon": "🐷", "img_prefix": "img/peppa/peppa_14/", "audio_prefix": "audio/peppa/peppa_14/"}, {"title": "动物模仿游戏", "pages": [{"text": "佩奇和朋友们在花园里玩。佩奇说：“我们来玩动物模仿游戏吧！”", "kw": "模仿游戏"}, {"text": "小羊苏西先来，她学小羊叫：“咩咩咩！”大家都猜对了，是小羊。", "kw": "小羊"}, {"text": "小狗丹尼跳出来，他学小狗叫：“汪汪汪！”还摇摇尾巴，真可爱。", "kw": "小狗"}, {"text": "小猫坎迪轻轻走，她学小猫叫：“喵喵喵！”还伸出爪子洗脸呢。", "kw": "小猫"}, {"text": "小兔瑞贝卡蹦蹦跳，她学小兔跳，还竖起长耳朵，大家都笑了。", "kw": "小兔"}, {"text": "最后佩奇学小猪叫：“哼哼哼！”大家都说佩奇模仿得最像了。", "kw": "小猪"}], "id": "peppa_15", "icon": "🐷", "img_prefix": "img/peppa/peppa_15/", "audio_prefix": "audio/peppa/peppa_15/"}, {"title": "佩奇分享玩具", "pages": [{"text": "佩奇在玩她的小恐龙。乔治跑过来，也想玩一玩。", "kw": "Peppa playing with dinosaur toy, George coming"}, {"text": "佩奇抱紧恐龙说：“这是我的，不给你。”乔治伤心地哭了。", "kw": "Peppa refusing to share, George crying"}, {"text": "猪妈妈走过来，温柔地说：“你们可以轮流玩呀。”", "kw": "Mummy Pig suggesting taking turns"}, {"text": "佩奇想了想，把恐龙递给乔治。乔治破涕为笑。", "kw": "Peppa handing dinosaur to George, George smiling"}, {"text": "他们一起玩恐龙，你追我赶，笑声不断。", "kw": "Peppa and George playing together happily"}, {"text": "分享真好玩，大家都开心！佩奇和乔治抱在了一起。", "kw": "Peppa and George hugging, sharing is fun"}], "id": "peppa_16", "icon": "🐷", "img_prefix": "img/peppa/peppa_16/", "audio_prefix": "audio/peppa/peppa_16/"}, {"title": "下雨天室内乐", "pages": [{"text": "下雨了，佩奇和乔治不能出去玩。他们在客厅里觉得有点无聊。", "kw": "rainy day, indoor, bored"}, {"text": "妈妈猪拿来一个大纸箱。她说：“我们来做点好玩的！”", "kw": "cardboard box, Mummy Pig, fun idea"}, {"text": "佩奇画了一个窗户，乔治画了一道门。纸箱变成了小房子！", "kw": "draw, window, door, little house"}, {"text": "他们钻进小房子里喝茶。佩奇假装是妈妈，乔治假装是爸爸。", "kw": "pretend play, tea party, role play"}, {"text": "爸爸猪也想进去，可是房子太小了！他把纸箱举起来，大家笑成一团。", "kw": "Daddy Pig, too small, lift box, laugh"}, {"text": "雨停了，太阳出来了。佩奇说：“雨天在家里也很好玩！”", "kw": "rain stops, sunshine, happy indoor play"}], "id": "peppa_17", "icon": "🐷", "img_prefix": "img/peppa/peppa_17/", "audio_prefix": "audio/peppa/peppa_17/"}, {"title": "佩奇运动会", "pages": [{"text": "今天天气真好，佩奇和朋友们要开运动会。大家穿上运动服，来到草地上。", "kw": "开幕"}, {"text": "第一个比赛是跑步。佩奇和小羊苏西一起跑，乔治在旁边加油。", "kw": "跑步"}, {"text": "接下来是跳远。小兔瑞贝卡跳得最远，大家都为她鼓掌。", "kw": "跳远"}, {"text": "接力赛开始了！爸爸猪和妈妈猪也加入，大家跑得真开心。", "kw": "接力赛"}, {"text": "最后是拔河比赛。小朋友一队，大人一队，大家一起用力拉绳子。", "kw": "拔河"}, {"text": "运动会结束了，每个人都得到了一枚奖牌。佩奇说：“运动真快乐！”", "kw": "颁奖"}], "id": "peppa_18", "icon": "🐷", "img_prefix": "img/peppa/peppa_18/", "audio_prefix": "audio/peppa/peppa_18/"}, {"title": "佩奇做三明治", "pages": [{"text": "佩奇和乔治饿了。他们想自己做三明治。", "kw": "hungry"}, {"text": "妈妈猪拿出了面包、生菜和番茄。", "kw": "ingredients"}, {"text": "佩奇小心地涂上黄油。乔治放上生菜。", "kw": "spread"}, {"text": "再加上一片奶酪和番茄。三明治越堆越高啦！", "kw": "tall"}, {"text": "妈妈猪帮忙把三明治切成三角形。", "kw": "cut"}, {"text": "佩奇和乔治大口吃三明治。真是太好吃了！", "kw": "yummy"}], "id": "peppa_19", "icon": "🐷", "img_prefix": "img/peppa/peppa_19/", "audio_prefix": "audio/peppa/peppa_19/"}, {"title": "告别演出", "pages": [{"text": "佩奇和朋友们要举办一场告别演出。大家都准备了精彩的节目。", "kw": "演出"}, {"text": "小羊苏西跳了一段芭蕾舞。她转了一圈又一圈。", "kw": "芭蕾舞"}, {"text": "小狗丹尼敲起了小鼓，咚咚咚。大家跟着节奏拍手。", "kw": "小鼓"}, {"text": "佩奇表演了吹泡泡。泡泡飘得高高的，真漂亮。", "kw": "泡泡"}, {"text": "最后，大家一起唱了一首歌。歌声又响又快乐。", "kw": "唱歌"}, {"text": "演出结束了，大家都说再见。明年还要一起玩哦！", "kw": "再见"}], "id": "peppa_20", "icon": "🐷", "img_prefix": "img/peppa/peppa_20/", "audio_prefix": "audio/peppa/peppa_20/"}, {"id": "story1_01", "title": "佩奇的第一天幼儿园", "icon": "🐷", "img_prefix": "img/story1/", "audio_prefix": "audio/story1/", "pages": [{"text": "今天，佩奇要去幼儿园啦！她穿上红色的裙子，背起小书包。", "kw": "school"}, {"text": "羚羊老师笑眯眯地迎接佩奇，带她认识新朋友。", "kw": "teacher"}, {"text": "大家一起玩传球游戏，佩奇跑得很快！", "kw": "game"}, {"text": "小朋友们围坐在一起唱儿歌，佩奇唱得最大声。", "kw": "song"}, {"text": "画画时间到了，佩奇画了一朵大大的太阳花。", "kw": "draw"}, {"text": "午饭香喷喷，佩奇对妈妈说：幼儿园真好玩！", "kw": "goodbye"}]}, {"id": "paw1_01", "title": "汪汪队：大火救援", "icon": "🐶", "img_prefix": "img/paw/", "audio_prefix": "audio/paw/", "pages": [{"text": "莱德和汪汪队在瞭望塔里玩耍。突然电话铃响了！", "kw": "瞭望塔"}, {"text": "不好了，城中心的大楼着火了！浓烟滚滚。", "kw": "着火"}, {"text": "毛毛跳上消防车，天天开直升机跟着。", "kw": "出发"}, {"text": "路马用水炮对准大火喷水。", "kw": "灭火"}, {"text": "大家齐心协力浇灭了大火！", "kw": "胜利"}, {"text": "市长给汪汪队颁发奖章，大家欢呼！", "kw": "英雄"}]}, {"id": "judy1_01", "title": "朱迪的交通大救援", "icon": "🐰", "img_prefix": "img/judy/", "audio_prefix": "audio/judy/", "pages": [{"text": "兔子警官朱迪在动物城巡逻，开着警车。", "kw": "巡逻"}, {"text": "前面堵车了！长长的车队一动不动。", "kw": "堵车"}, {"text": "原来是小羊的推车坏在路中间。", "kw": "推车"}, {"text": "朱迪拿出工具修好了推车。", "kw": "修理"}, {"text": "朱迪指挥交通，道路恢复了通畅。", "kw": "指挥"}, {"text": "小羊说谢谢！朱迪说帮助别人最快乐！", "kw": "快乐"}]}];

// ==================== AUDIO MANAGER (Edge Neural TTS MP3) ====================
class AudioManager {
  constructor() {
    this.manifest = {};
    this.currentAudios = [];
    this.muted = false;
    this.speakingCard = null;
    this.loaded = false;
    this._load();
  }
  _load() {
    try {
      this.manifest = EMBEDDED_MANIFEST;
      this.loaded = true;
      console.log('🎙️ 神经网络语音已就绪 ('+Object.keys(this.manifest).length+' 条)');
    } catch(e) {
      console.warn('⚠️ 语音包未加载，使用浏览器备用语音');
    }
  }
  _path(text) { return this.loaded ? (this.manifest[text] || null) : null; }
  _playFile(path, onEnd) {
    if (this.muted || !path) { if (onEnd) onEnd(); return; }
    const a = new Audio(path);
    a.preload = 'auto';
    this.currentAudios.push(a);
    const cleanup = () => {
      const i = this.currentAudios.indexOf(a);
      if (i >= 0) this.currentAudios.splice(i, 1);
      if (onEnd) onEnd();
    };
    a.addEventListener('ended', cleanup, {once:true});
    a.addEventListener('error', cleanup, {once:true});
    a.play().catch(cleanup);
  }
  _ttsFallback(text, onEnd) {
    if (!window.speechSynthesis) { if (onEnd) onEnd(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85; u.pitch = 1.1;
    if (onEnd) u.onend = onEnd;
    window.speechSynthesis.speak(u);
  }
  speakCard(el, textZh, textEn) {
    if (this.muted) return;
    if (el === this.speakingCard) return;
    this.cancel();
    if (this.speakingCard) this.speakingCard.classList.remove('speaking');
    this.speakingCard = el;
    el.classList.add('speaking');
    const zhPath = this._path(textZh);
    const enPath = this._path(textEn);
    const done = () => { el.classList.remove('speaking'); this.speakingCard = null; };
    if (zhPath) {
      this._playFile(zhPath, () => {
        if (enPath) this._playFile(enPath, done); else done();
      });
    } else if (enPath) {
      this._playFile(enPath, done);
    } else {
      this._ttsFallback(textZh || textEn || '', done);
    }
  }
  speak(text) {
    if (this.muted) return;
    this.cancel();
    const path = this._path(text);
    if (path) this._playFile(path);
    else this._ttsFallback(text);
  }
  cancel() {
    this.currentAudios.forEach(a => { a.pause(); a.src = ''; });
    this.currentAudios = [];
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }
  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) this.cancel();
    return this.muted;
  }
}

class EduApp {
  constructor() {
    this.audio = new AudioManager();
    this.state = { mathTab:'numbers', englishTab:'alphabet', generalTab:'safety', quizScore:0, quizTotal:0, quizAnswered:false };
    this.init();
  }

  init() {
    this.renderFloaties();
    this.bindGlobalEvents();
    document.getElementById('btnMute').addEventListener('click', () => {
      const muted = this.audio.toggleMute();
      document.getElementById('btnMute').textContent = muted ? '🔇' : '🔊';
    });
    document.getElementById('btnHome').addEventListener('click', () => this.goBack());
  }

  renderFloaties() {
    const c = document.getElementById('floaties');
    const emojis = ['⭐','🌟','💫','✨','🌸','🦋','🎈','🎵','💖','🍀','☁️','🌈'];
    for (let i=0; i<25; i++) {
      const el = document.createElement('span');
      el.className = 'floaty';
      el.textContent = emojis[i % emojis.length];
      el.style.left = Math.random()*95 + '%';
      el.style.animationDuration = (12 + Math.random()*20) + 's';
      el.style.animationDelay = Math.random()*15 + 's';
      el.style.fontSize = (18 + Math.random()*30) + 'px';
      c.appendChild(el);
    }
  }

  bindGlobalEvents() {
    this._lastHovered = null;
    document.addEventListener('mouseover', e => {
      const card = e.target.closest('[data-speak]');
      if (card && card !== this._lastHovered) {
        this._lastHovered = card;
        this.handleCardHover(card);
      }
    }, true);
    document.addEventListener('click', e => {
      const card = e.target.closest('[data-speak]');
      if (card && 'ontouchstart' in window) this.handleCardHover(card);
    }, true);
  }

  handleCardHover(el) {
    const zh = el.dataset.speak;
    const en = el.dataset.speakEn;
    this.audio.speakCard(el, zh, en);
  }

  navigate(page) {
    this.audio.cancel();
    this._lastHovered = null;
    this._pageHistory = this._pageHistory || [];
    if (page !== 'home') this._pageHistory.push(page);
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page-'+page);
    if (target) target.classList.add('active');
    document.getElementById('btnHome').style.display = 'inline-flex';
    if (page === 'math') this.renderMathTab();
    if (page === 'english') this.renderEnglishTab();
    if (page === 'general') this.renderGeneralTab();
    if (page === 'story') this.renderStory();
  }
  
  goBack() {
    this.audio.cancel();
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-home').classList.add('active');
    document.getElementById('btnHome').style.display = 'none';
  }

  // ==================== MATH ====================
  showMathTab(tab) {
    this.audio.cancel();
    this.state.mathTab = tab;
    // Hide sub-cards, show content
    const subCards = document.querySelector('#page-math .sub-cards');
    const content = document.getElementById('math-content');
    if (subCards) subCards.style.display = 'none';
    if (content) { content.style.display = 'block'; content.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">加载中...</div>'; }
    this.renderMathTab();
    // Add back button for sub-menu
    if (!document.getElementById('mathBack')) {
      const backBtn = document.createElement('button');
      backBtn.id = 'mathBack';
      backBtn.className = 'btn-back';
      backBtn.textContent = '⬅ 返回数学菜单';
      backBtn.onclick = () => this.showMathMenu();
      backBtn.style.marginBottom = '8px';
      content.parentNode.insertBefore(backBtn, content);
    } else {
      document.getElementById('mathBack').style.display = 'inline-flex';
    }
  }
  
  showMathMenu() {
    const subCards = document.querySelector('#page-math .sub-cards');
    const content = document.getElementById('math-content');
    if (subCards) subCards.style.display = '';
    if (content) content.style.display = 'none';
    const backBtn = document.getElementById('mathBack');
    if (backBtn) backBtn.style.display = 'none';
  }

  renderMathTab() {
    const t = this.state.mathTab;
    const c = document.getElementById('math-content');
    if (t === 'numbers') this.renderNumbers(c);
    else if (t === 'counting') this.renderCounting(c);
    else if (t === 'addition') this.renderQuiz(c, '+');
    else if (t === 'subtraction') this.renderQuiz(c, '-');
    else if (t === 'multiplication') this.renderMultiplication(c);
    else if (t === 'comparison') this.renderComparison(c);
    else if (t === 'ordering') this.renderOrdering(c);
    else if (t === 'patterns') this.renderPatterns(c);
    else if (t === 'trace') this.renderTrace(c);
    else if (t === 'clock') this.renderClock(c);
    else if (t === 'money') this.renderMoney(c);
  }

  renderNumbers(container) {
    let h = '<div class="cards-grid">';
    MATH_NUMBERS.forEach(m => {
      const objs = m.n > 0 ? m.e.repeat(Math.min(m.n, 15)) : '';
      h += `<div class="item-card" data-speak="这是数字${m.cn}" data-speak-en="${m.en}" data-n="${m.n}">
        <span class="speaker-hint">🔊</span>
        <div class="num">${m.n}</div>
        <div class="cn">${m.cn}</div>
        <div class="en">${m.en}</div>
        ${objs ? `<div class="emoji-block">${objs}</div>` : ''}
      </div>`;
    });
    h += '</div>';
    container.innerHTML = h;
  }

  renderCounting(container) {
    const count = Math.floor(Math.random()*15)+1;
    const objs = MATH_NUMBERS.find(m=>m.n===count);
    const emoji = objs ? objs.e : '⭐';
    const wrongOptions = new Set();
    while(wrongOptions.size < 3) {
      const w = Math.floor(Math.random()*20)+1;
      if (w !== count) wrongOptions.add(w);
    }
    const options = [count, ...wrongOptions].sort(()=>Math.random()-0.5);

    container.innerHTML = `
      <div class="quiz-area">
        <h3>🧮 数一数，有多少个？</h3>
        <div class="quiz-visual count-objects" id="countObjs">
          ${emoji.repeat(count)}
        </div>
        <div class="quiz-options">
          ${options.map(o => `<button class="quiz-option" data-ans="${o}" onclick="app.checkCounting(${count},${o},this)">${o}</button>`).join('')}
        </div>
        <div class="quiz-feedback" id="countFeedback"></div>
        <button class="btn-next" onclick="app.renderMathTab()" style="display:none" id="countNext">再来一题 ⭐</button>
      </div>`;
  }

  checkCounting(correct, chosen, btn) {
    const fb = document.getElementById('countFeedback');
    const next = document.getElementById('countNext');
    document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
    if (chosen === correct) {
      btn.classList.add('correct');
      fb.textContent = '🎉 答对了！太棒了！';
      fb.style.color = '#34C759';
      this.audio.speak('答对了！你真聪明！');
      this.celebrate();
    } else {
      btn.classList.add('wrong');
      fb.textContent = `😊 正确答案是 ${correct}，再试试吧！`;
      fb.style.color = '#FF9500';
      this.audio.speak(`正确答案是${correct}`);
      document.querySelector(`.quiz-option[data-ans="${correct}"]`).classList.add('correct');
    }
    next.style.display = 'inline-block';
  }

  renderQuiz(container, op) {
    const a = Math.floor(Math.random()*8)+1;
    let b, correct;
    if (op === '+') { b = Math.floor(Math.random()*8)+1; correct = a+b; }
    else { b = Math.floor(Math.random()*a)+1; correct = a-b; }
    const emoji = MATH_NUMBERS.find(m=>m.n===1).e;
    const wrongOptions = new Set();
    while(wrongOptions.size < 3) {
      const w = Math.floor(Math.random()*20);
      if (w !== correct && w >= 0) wrongOptions.add(w);
    }
    const options = [correct, ...wrongOptions].sort(()=>Math.random()-0.5);

    const visA = emoji.repeat(Math.min(a,12));
    const visB = emoji.repeat(Math.min(b,12));

    container.innerHTML = `
      <div class="quiz-area">
        <h3>${op==='+' ? '➕ 加法练习' : '➖ 减法练习'}</h3>
        <div style="display:flex;justify-content:center;gap:20px;align-items:center;flex-wrap:wrap;font-size:28px;margin:16px 0;">
          <div style="text-align:center;"><div style="font-size:16px;color:#888;">${a}</div><div style="font-size:22px;">${visA}</div></div>
          <div style="font-size:32px;font-weight:700;">${op}</div>
          <div style="text-align:center;"><div style="font-size:16px;color:#888;">${b}</div><div style="font-size:22px;">${visB}</div></div>
          <div style="font-size:32px;font-weight:700;">=</div>
          <div style="font-size:36px;color:var(--orange);">?</div>
        </div>
        <div class="quiz-options">
          ${options.map(o => `<button class="quiz-option" data-ans="${o}" onclick="app.checkQuiz(${correct},${o},this)">${o}</button>`).join('')}
        </div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="btn-next" onclick="app.renderMathTab()" style="display:none" id="quizNext">再来一题 ⭐</button>
      </div>`;
  }

  checkQuiz(correct, chosen, btn) {
    const fb = document.getElementById('quizFeedback');
    const next = document.getElementById('quizNext');
    document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
    if (chosen === correct) {
      btn.classList.add('correct');
      fb.textContent = '🎉 太厉害了！';
      fb.style.color = '#34C759';
      this.audio.speak('答对了！宝宝真棒！');
      this.celebrate();
    } else {
      btn.classList.add('wrong');
      fb.textContent = `😊 答案是 ${correct}`;
      fb.style.color = '#FF9500';
      this.audio.speak(`正确答案是${correct}`);
      document.querySelector(`.quiz-option[data-ans="${correct}"]`).classList.add('correct');
    }
    next.style.display = 'inline-block';
  }

  renderTrace(container) {
    const num = Math.floor(Math.random()*10);
    const item = MATH_NUMBERS.find(m=>m.n===num);
    container.innerHTML = `
      <div class="quiz-area" style="text-align:center;">
        <h3>✏️ 写数字练习</h3>
        <div style="font-size:18px;margin:8px 0;color:#666;">${item.cn} (${item.en})</div>
        <div style="font-size:100px;color:#DDD;letter-spacing:8px;margin-top:-70px;margin-bottom:-70px;line-height:1.8;">${num}</div>
        <canvas class="trace-canvas" id="traceCanvas" width="280" height="200" style="touch-action:none;" data-trace-num="${num}"></canvas>
        <div class="trace-controls">
          <button onclick="app.clearTrace()">🗑️ 擦除</button>
          <button onclick="app.renderMathTab()">🔄 下一个</button>
        </div>
        <div class="quiz-feedback" id="traceFeedback"></div>
      </div>`;
    this.initTraceCanvas(num);
  }

  initTraceCanvas(num) {
    const canvas = document.getElementById('traceCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#EEE';
    ctx.font = '120px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(num, canvas.width/2, canvas.height/2);

    let drawing = false;
    const draw = (e) => {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
      const y = (e.touches?e.touches[0].clientY:e.clientY) - rect.top;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI*2);
      ctx.fillStyle = '#FF6B8A';
      ctx.fill();
    };
    canvas.addEventListener('mousedown', e => { drawing=true; draw(e); });
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', () => drawing=false);
    canvas.addEventListener('mouseleave', () => drawing=false);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing=true; draw(e); });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e); });
    canvas.addEventListener('touchend', () => drawing=false);
  }

  clearTrace() {
    const canvas = document.getElementById('traceCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#EEE';
    ctx.font = '120px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const num = parseInt(canvas.dataset.traceNum) || 5;
    ctx.fillText(num, canvas.width/2, canvas.height/2);
  }

  // ============== MATH: MULTIPLICATION ==============
  renderMultiplication(container) {
    const a = Math.floor(Math.random()*4)+2; // 2-5
    const b = Math.floor(Math.random()*4)+2; // 2-5
    const correct = a * b;
    const emoji = ['⭐','🐱','🐶','🍎','🌟'][a%5];
    const wrongs = new Set();
    while(wrongs.size < 3) { const w = Math.floor(Math.random()*30)+1; if(w !== correct) wrongs.add(w); }
    const opts = [correct, ...wrongs].sort(()=>Math.random()-0.5);

    let vis = '';
    for (let r=0; r<a; r++) { vis += '<div>'+emoji.repeat(Math.min(b,8))+'</div>'; }

    container.innerHTML = `<div class="quiz-area">
      <h3>✖️ 乘法入门</h3>
      <div style="font-size:28px;font-weight:700;margin:8px 0;">${a} × ${b} = ？</div>
      <div style="font-size:24px;line-height:1.6;margin:8px 0;">${vis}</div>
      <div style="font-size:14px;color:#888;">${a} 排，每排 ${b} 个，一共多少个？</div>
      <div class="quiz-options">${opts.map(o=>`<button class="quiz-option" data-ans="${o}" onclick="app.checkQuiz(${correct},${o},this)">${o}</button>`).join('')}</div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <button class="btn-next" onclick="app.renderMathTab()" style="display:none" id="quizNext">再来一题 ⭐</button>
    </div>`;
  }

  // ============== MATH: COMPARISON ==============
  renderComparison(container) {
    const type = Math.random()>0.5?'bigger':'smaller';
    let n1 = Math.floor(Math.random()*15)+1, n2 = n1;
    while(n2 === n1) n2 = Math.floor(Math.random()*15)+1;
    const correct = type==='bigger' ? Math.max(n1,n2) : Math.min(n1,n2);
    const e = MATH_NUMBERS.find(m=>m.n===1).e;
    const wrongs = new Set(); wrongs.add(correct);
    while(wrongs.size<4) { const w=Math.floor(Math.random()*15)+1; wrongs.add(w); }
    const opts = [...wrongs].sort(()=>Math.random()-0.5);

    container.innerHTML = `<div class="quiz-area">
      <h3>⚖️ 比较大小</h3>
      <div style="font-size:20px;color:#666;margin:8px 0;">${type==='bigger'?'哪个更多/更大？':'哪个更少/更小？'}</div>
      <div style="display:flex;justify-content:center;gap:30px;align-items:flex-end;margin:12px 0;">
        <div style="text-align:center;"><div style="font-size:14px;color:#888;">${n1}</div><div style="font-size:20px;">${e.repeat(Math.min(n1,10))}</div></div>
        <div style="font-size:30px;font-weight:700;">VS</div>
        <div style="text-align:center;"><div style="font-size:14px;color:#888;">${n2}</div><div style="font-size:20px;">${e.repeat(Math.min(n2,10))}</div></div>
      </div>
      <div class="quiz-options">${opts.map(o=>`<button class="quiz-option" data-ans="${o}" onclick="app.checkComparison(${correct},${o},this)">${o}</button>`).join('')}</div>
      <div class="quiz-feedback" id="countFeedback"></div>
      <button class="btn-next" onclick="app.renderMathTab()" style="display:none" id="countNext">再来一题 ⭐</button>
    </div>`;
  }

  checkComparison(correct, chosen, btn) {
    document.querySelectorAll('.quiz-option').forEach(b=>b.disabled=true);
    const fb = document.getElementById('countFeedback'), next = document.getElementById('countNext');
    if (chosen===correct) {
      btn.classList.add('correct'); fb.textContent='🎉 答对了！'; fb.style.color='#34C759';
      this.audio.speak('答对了！'); this.celebrate();
    } else {
      btn.classList.add('wrong'); fb.textContent=`😊 答案是 ${correct}`; fb.style.color='#FF9500';
      this.audio.speak(`正确答案是${correct}`);
      document.querySelector(`.quiz-option[data-ans="${correct}"]`).classList.add('correct');
    }
    next.style.display='inline-block';
  }

  // ============== MATH: NUMBER ORDERING ==============
  renderOrdering(container) {
    const nums = new Set();
    while(nums.size < 4) nums.add(Math.floor(Math.random()*15)+1);
    const arr = [...nums]; const sorted = [...nums].sort((a,b)=>a-b);
    const shuffled = [...arr].sort(()=>Math.random()-0.5);
    this._orderingData = { shuffled, sorted, selected:[] };

    container.innerHTML = `<div class="quiz-area">
      <h3>🔢 数字排序</h3>
      <div style="font-size:18px;color:#666;margin:8px 0;">按从小到大的顺序点击数字</div>
      <div class="quiz-options" id="orderingBtns">${shuffled.map(n=>`<button class="quiz-option" data-n="${n}" onclick="app.selectOrder(${n},this)" style="width:56px;height:56px;">${n}</button>`).join('')}</div>
      <div style="margin:12px 0;font-size:22px;min-height:36px;" id="orderResult"></div>
      <div class="quiz-feedback" id="orderFeedback"></div>
      <button class="btn-next" onclick="app.renderMathTab()" style="display:none" id="orderNext">再来一题 ⭐</button>
    </div>`;
  }

  selectOrder(n, btn) {
    const data = this._orderingData;
    if (!data || btn.classList.contains('selected')) return;
    btn.classList.add('selected'); btn.style.background='#E8F4FF'; btn.style.borderColor='var(--blue)';
    data.selected.push(n);
    document.getElementById('orderResult').textContent = data.selected.join(' → ');
    if (data.selected.length === data.sorted.length) {
      const correct = data.selected.every((v,i)=>v===data.sorted[i]);
      const fb = document.getElementById('orderFeedback');
      const next = document.getElementById('orderNext');
      if (correct) {
        fb.textContent='🎉 完全正确！'; fb.style.color='#34C759';
        this.audio.speak('答对了！宝宝真棒！'); this.celebrate();
      } else {
        fb.textContent=`😊 正确顺序是 ${data.sorted.join(' → ')}`; fb.style.color='#FF9500';
        this.audio.speak(`正确答案是${data.sorted.join(' ')}`);
      }
      next.style.display='inline-block';
      document.querySelectorAll('#orderingBtns .quiz-option').forEach(b=>b.disabled=true);
    }
  }

  // ============== MATH: PATTERNS ==============
  renderPatterns(container) {
    const patterns = [
      {seq:['⭐','🌟','⭐','🌟','⭐','?'], opts:['🌟','⭐','✨','💫'], ans:0},
      {seq:['🍎','🍎','🍊','🍎','🍎','?'], opts:['🍎','🍊','🍋','🍌'], ans:1},
      {seq:['🔴','🔵','🔴','🔵','🔴','?'], opts:['🟢','🔴','🔵','🟡'], ans:2},
      {seq:['1','2','3','4','5','?'], opts:['4','7','6','8'], ans:2},
      {seq:['🐱','🐶','🐱','🐶','🐱','?'], opts:['🐰','🐱','🐶','🐻'], ans:2},
      {seq:['2','4','6','8','10','?'], opts:['11','10','12','14'], ans:2},
    ];
    const p = patterns[Math.floor(Math.random()*patterns.length)];
    this._patternData = { correctIdx:p.ans };

    container.innerHTML = `<div class="quiz-area">
      <h3>🔮 找规律</h3>
      <div style="font-size:18px;color:#666;margin:8px 0;">下一个是什么？</div>
      <div style="font-size:44px;letter-spacing:8px;margin:12px 0;">${p.seq.join(' ')}</div>
      <div class="quiz-options">${p.opts.map((o,i)=>`<button class="quiz-option" data-idx="${i}" onclick="app.checkPattern(${i},this)" style="font-size:30px;">${o}</button>`).join('')}</div>
      <div class="quiz-feedback" id="patternFeedback"></div>
      <button class="btn-next" onclick="app.renderMathTab()" style="display:none" id="patternNext">再来一题 ⭐</button>
    </div>`;
  }

  checkPattern(idx, btn) {
    document.querySelectorAll('.quiz-option').forEach(b=>b.disabled=true);
    const fb = document.getElementById('patternFeedback'), next = document.getElementById('patternNext');
    if (idx === this._patternData.correctIdx) {
      btn.classList.add('correct'); fb.textContent='🎉 正确！'; fb.style.color='#34C759';
      this.audio.speak('答对了！太厉害了！'); this.celebrate();
    } else {
      btn.classList.add('wrong'); fb.textContent='😊 再观察一下规律吧'; fb.style.color='#FF9500';
      this.audio.speak('没关系，再试试吧');
      document.querySelector(`.quiz-option[data-idx="${this._patternData.correctIdx}"]`).classList.add('correct');
    }
    next.style.display='inline-block';
  }

  // ============== ENGLISH: DIALOGUES ==============
  renderDialogues(container) {
    const stripPunct = s => s.replace(/[！？。，、\.\!\?,]/g, '');
    let h = '<div class="cards-grid">';
    DIALOGUES.forEach(d => {
      h += `<div class="item-card" data-speak="${stripPunct(d.cn)}" data-speak-en="${stripPunct(d.en)}" style="min-height:120px;">
        <span class="speaker-hint">🔊</span>
        <div class="emoji-block" style="font-size:28px;">${d.e}</div>
        <div class="word" style="font-size:14px;">${d.en}</div>
        <div class="meaning">${d.cn}</div>
      </div>`;
    });
    h += '</div>';
    container.innerHTML = h;
  }

  // ==================== ENGLISH ====================
  showEnglishTab(tab) {
    this.audio.cancel();
    this.state.englishTab = tab;
    const subCards = document.querySelector('#page-english .sub-cards');
    const content = document.getElementById('english-content');
    if (subCards) subCards.style.display = 'none';
    if (content) { content.style.display = 'block'; content.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">加载中...</div>'; }
    this.renderEnglishTab();
    if (!document.getElementById('engBack')) {

      backBtn.id = 'engBack';
      backBtn.className = 'btn-back';

      backBtn.onclick = () => this.showEnglishMenu();
      backBtn.style.marginBottom = '8px';
      content.parentNode.insertBefore(backBtn, content);
    } else {
      document.getElementById('engBack').style.display = 'inline-flex';
    }
  }
  
  showEnglishMenu() {
    const subCards = document.querySelector('#page-english .sub-cards');
    const content = document.getElementById('english-content');
    if (subCards) subCards.style.display = '';
    if (content) content.style.display = 'none';
    const backBtn = document.getElementById('engBack');
    if (backBtn) backBtn.style.display = 'none';
  }

  renderEnglishTab() {
    const t = this.state.englishTab;
    const c = document.getElementById('english-content');
    if (t === 'alphabet') this.renderAlphabet(c);
    else if (t === 'animals') this.renderVocab(c, ANIMALS);
    else if (t === 'colors') this.renderColors(c, COLORS);
    else if (t === 'fruits') this.renderVocab(c, FRUITS);
    else if (t === 'body') this.renderVocab(c, BODY);
    else if (t === 'dialogues') this.renderDialogues(c);
    else if (t === 'places') this.renderVocab(c, PLACES);
    else if (t === 'food') this.renderVocab(c, FOODS);

  // ==================== STORYBOOK READER ====================
  renderStory() {
    const c = document.getElementById('story-content');
    // Load all available stories from JSON
    this._loadStories().then(stories => {
      if (stories.length === 0) {
        c.innerHTML = '<div class="quiz-area"><h3>📖 故事书</h3><p>正在生成故事，请稍后再来...</p></div>';
        return;
      }
      let h = '<div class="cards-grid" style="gap:14px;">';
      stories.forEach((s,i) => {
        h += `<div class="item-card" onclick="app.openStory(${i})" style="min-height:100px;">
          <div class="emoji-block" style="font-size:40px;">${s.icon||'📖'}</div>
          <div class="word">${s.title}</div>
          <div class="meaning">${(s.pages||[]).length} 页 · AI插图+语音</div>
        </div>`;
      });
      h += '</div>';
      c.innerHTML = `<div class="quiz-area">
        <h3>📖 故事书</h3>
        <div style="font-size:14px;color:#888;margin-bottom:8px;">已生成 ${stories.length} 集，持续更新中</div>
        ${h}
      </div>`;
      this._allStories = stories;
    });
  }
